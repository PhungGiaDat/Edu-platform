name: edu-platform-backend

services:
  backend:
    image: ghcr.io/phunggiadat/edu-platform-backend:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Keep the existing persistence config. Never evict lock/rate-limit keys.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    mem_limit: 384m
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
