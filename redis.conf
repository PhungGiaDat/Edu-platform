# ========================================
# Redis Configuration for Edu-platform
# Optimized for local development and production
# ========================================

# ========================================
# Network
# ========================================
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# ========================================
# General
# ========================================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ========================================
# Snapshotting (RDB)
# ========================================
# Save data to disk - configured for balanced persistence
save 900 1      # After 15 min if at least 1 key changed
save 300 10     # After 5 min if at least 10 keys changed
save 60 10000   # After 1 min if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ========================================
# Replication
# ========================================
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# ========================================
# Security
# ========================================
# Require password for connections (uncomment for production)
# requirepass your-strong-password-here

# Rename dangerous commands (uncomment for production)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ========================================
# Memory Management
# ========================================
# Max memory - adjust based on available RAM
# 256mb for local dev, increase for production
maxmemory 256mb
maxmemory-policy allkeys-lru

# Memory allocation
# activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100

# ========================================
# Append Only File (AOF)
# ========================================
# Enable AOF for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ========================================
# Slow Log
# ========================================
slowlog-log-slower-than 10000  # Log commands slower than 10ms
slowlog-max-len 128           # Keep last 128 slow commands

# ========================================
# Latency Monitor
# ========================================
latency-monitor-threshold 100  # Monitor commands taking >100ms

# ========================================
# Event Notification
# ========================================
notify-keyspace-events Ex

# ========================================
# Advanced Config
# ========================================
# Hashes
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Lists
list-max-ziplist-size -2
list-compress-depth 0

# Sets
set-max-intset-entries 512

# Sorted Sets
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# ========================================
# Connection Pool Settings (Client-side)
# ========================================
# These are client-side settings, configured in application code:
# max_connections: 50
# socket_timeout: 5
# socket_connect_timeout: 5
# retry_on_timeout: yes
# health_check_interval: 30
