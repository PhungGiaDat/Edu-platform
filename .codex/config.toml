# Generated from opencode.json by scripts/migrate_opencode_to_codex.py
# Review command availability before relying on migrated MCP servers.

[agents]
max_threads = 5
max_depth = 3

[mcp_servers.ast-grep]
command = "sh"
args = ["-c", "[ -f .ast-grep/sgconfig.yml ] || (mkdir -p .ast-grep && printf 'ruleDirs: []\\n' > .ast-grep/sgconfig.yml); exec uvx --from git+https://github.com/ast-grep/ast-grep-mcp ast-grep-server --config .ast-grep/sgconfig.yml"]

[mcp_servers.mcpls]
command = "mcpls"
args = []

[mcp_servers.qmd]
command = "qmd"
args = ["mcp"]

[mcp_servers.blender]
command = "C:\\Users\\LENOVO\\.local\\bin\\uvx.exe"
args = ["blender-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers.unityMCP]
command = "C:\\Users\\LENOVO\\.local\\bin\\uvx.exe"
args = ["--from", "mcpforunityserver==10.1.2", "mcp-for-unity", "--transport", "stdio"]
startup_timeout_sec = 60
env = { SystemRoot = "C:\\WINDOWS" }

[mcp_servers.mongodb]
command = "npx.cmd"
args = ["--cache", "E:\\University\\Graduted Project\\Edu-platform\\.codex\\npm-cache", "-y", "mongodb-mcp-server@2.1.0", "--readOnly"]
startup_timeout_sec = 120
env = { MDB_MCP_CONNECTION_STRING = "${MONGODB_ATLAS_URI}" }

[mcp_servers.supabase]
command = "npx"
args = ["-y", "@supabase/mcp-server-supabase@latest"]
# Set SUPABASE_ACCESS_TOKEN in your shell environment or .env to enable Supabase MCP
env = { SUPABASE_ACCESS_TOKEN = "${SUPABASE_ACCESS_TOKEN}" }
