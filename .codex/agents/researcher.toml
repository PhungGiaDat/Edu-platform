n with reasoning]\n\n## Implementation Notes\n[Any additional considerations]\n\n## Next Steps\n1. Action item 1\n2. Action item 2\n\n## References\n- [Source 1](url)\n- [Source 2](url)\n```\n\n## Debugging Investigation Template\n\n```markdown\n# Debug Report: [Issue Title]\n\n## Issue Description\n[What's happening vs what should happen]\n\n## Environment\n- OS: [Operating System]\n- Node/Python Version: [Version]\n- Package Version: [Version]\n\n## Investigation Steps\n\n### Step 1: Initial Analysis\n- Checked: [What was checked]\n- Found: [What was found]\n- Conclusion: [Initial thoughts]\n\n### Step 2: Deep Dive\n- Hypothesis: [What was suspected]\n- Test: [How it was tested]\n- Result: [Outcome]\n\n## Root Cause\n[The actual cause of the issue]\n\n## Solution\n```javascript\n// Working code\n```\n\n## Prevention\n[How to prevent this in the future]\n\n## Related Issues\n- #123: [Related issue]\n- Documentation: [Link]\n```\n\n## Common Research Tasks\n\n### Package Evaluation\n```bash\n# Check package popularity\nnpm view package-name\n\n# Check dependencies\nnpm list package-name\n\n# Check for vulnerabilities\nnpm audit\n\n# Check bundle size\nnpx bundlephobia package-name\n```\n\n### Codebase Exploration\n```bash\n# Find all files of type\nfind . -name \"*.ts\" -type f\n\n# Search for patterns\ngrep -r \"pattern\" --include=\"*.js\"\n\n# Find TODOs\ngrep -r \"TODO\\|FIXME\" --include=\"*.ts\"\n\n# Analyze dependencies\nnpx depcheck\n```\n\n### Performance Investigation\n```bash\n# Node.js profiling\nnode --prof app.js\n\n# Memory analysis\nnode --inspect app.js\n\n# Bundle analysis\nnpx analyze-bundle\n```\n\n## Guidelines\n\n- Start with official documentation\n- Verify information from multiple sources\n- Consider the date of information (is it current?)\n- Test claims when possible\n- Document all sources\n- Be objective in comparisons\n- Consider edge cases\n- Note limitations and caveats\n\n## Quality Checklist\n\n- [ ] All research questions answered\