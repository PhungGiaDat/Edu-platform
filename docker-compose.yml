# ========================================
# Eduplatform - Docker Compose
# Local Development & Production Stack
# ========================================

services:
  # ========================================
  # MongoDB Database
  # ========================================
  mongodb:
    image: mongo:7
    container_name: eduplatform-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: edu_platform
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - eduplatform-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: eduplatform-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - eduplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ========================================
  # Backend API (FastAPI)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: eduplatform-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DB=edu_platform
      # Refusing to start with a default SECRET_KEY — set one in .env or shell.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env or shell environment}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PORT=8000
      - WORKERS=2
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TTL=${REDIS_TTL:-300}
      - APP_LOCK_TIMEOUT=${APP_LOCK_TIMEOUT:-1500}
      # New env-driven configuration (see backend/.env.example)
      - SUPABASE_PROJECT_URL=${SUPABASE_PROJECT_URL:?SUPABASE_PROJECT_URL must be set in .env or shell environment}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-AR_models}
      - AVATAR_SERVICE_URL=${AVATAR_SERVICE_URL:-https://api.dicebear.com/7.x/avataaars/svg}
      - DEFAULT_FRONTEND_ORIGIN=${DEFAULT_FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - backend_static:/app/static
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eduplatform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Frontend Web (Vite + React)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: eduplatform-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - VITE_APP_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - eduplatform-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ========================================
  # Nginx Reverse Proxy (Production)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: eduplatform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      # Uncomment and configure for SSL:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - eduplatform-network
    profiles:
      - production

# ========================================
# Volumes
# ========================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_uploads:
    driver: local
  frontend_dist:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  eduplatform-network:
    driver: bridge
