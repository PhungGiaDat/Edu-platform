<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Scanner</title>

    <!-- jsQR - Lightweight QR Scanner (~50KB) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="/static/ar-assets/css/ar-scanner.css">
</head>

<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- Scanning Guide Overlay -->
    <div id="scanning-guide" style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 250px;
        border: 3px solid rgba(0, 255, 0, 0.6);
        border-radius: 16px;
        z-index: 50;
        pointer-events: none;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.2);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 20px;
    ">
        <div style="
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(0, 255, 0, 0.5);
        ">
            📷 Point camera at QR code
        </div>
    </div>

    <!-- Status overlay: shown only when ?debug=true, removed once camera is ready -->
    <div id="scanner-status" style="
        display: none;
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        color: #0f0;
        font-family: monospace;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 20px;
        z-index: 9999;
        pointer-events: none;
        white-space: nowrap;
    ">⏳ Requesting camera...</div>

    <script>
        // Show status overlay only in debug mode
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('debug') === 'true') {
                document.getElementById('scanner-status').style.display = 'block';
            }
        })();
    </script>

    <!-- External JS -->
    <script src="/static/ar-assets/js/ar-scanner.js"></script>
</body>

</html>
