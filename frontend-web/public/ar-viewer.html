<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Viewer</title>

    <!-- A-Frame 1.4+ -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR Image Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="/static/ar-assets/css/ar-viewer.css">
</head>

<body>
    <!-- Loading overlay removed - direct AR experience -->

    <!-- AR Loading Overlay — shown while models download, hidden once arReady fires -->
    <div id="ar-loading-overlay" style="
        position:fixed;inset:0;
        background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        z-index:9999;transition:opacity 0.4s ease;
    ">
        <div style="
            width:64px;height:64px;border-radius:50%;
            border:6px solid rgba(255,255,255,0.3);
            border-top:6px solid #fff;
            animation:arSpin 0.8s linear infinite;
        "></div>
        <p id="ar-load-text" style="color:#fff;font-size:16px;font-weight:700;margin-top:20px;font-family:sans-serif;">
            Starting AR...
        </p>
        <style>@keyframes arSpin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- A-Frame Scene - MindAR handles camera video layer automatically -->
    <a-scene id="ar-scene"
        mindar-image="imageTargetSrc: ; maxTrack: 2; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.001"
        color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true" embedded
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <!-- Timeout raised to 15s so models load over slow Render cold-start -->
        <a-assets timeout="15000">
            <!-- Dynamic assets loaded via URL params -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false">
            <!-- Cursor disabled - using native touch events for mobile compatibility -->
            <!-- <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 1000"></a-entity> -->
        </a-camera>

        <!-- Target 0: Primary flashcard -->
        <a-entity id="target-0" mindar-image-target="targetIndex: 0" visible="true">
            <!-- 2D Mode: Image plane (initially hidden, toggled via mode switch) -->
            <a-image id="mode-2d-0" class="clickable" position="0 0 0" rotation="0 0 0" width="1" height="1"
                visible="false">
            </a-image>

            <!-- 3D Mode: GLTF Model (default visible) - smaller scale for mobile -->
            <a-entity id="mode-3d-0" class="clickable" position="0 0.05 0" rotation="0 0 0" scale="0.25 0.25 0.25"
                animation__hover="property: scale; to: 0.28 0.28 0.28; dur: 200; startEvents: mouseenter"
                animation__leave="property: scale; to: 0.25 0.25 0.25; dur: 200; startEvents: mouseleave"
                animation__click="property: scale; from: 0.25 0.25 0.25; to: 0.3 0.3 0.3; dir: alternate; loop: 1; dur: 150; startEvents: click"
                visible="true">
            </a-entity>
        </a-entity>

        <!-- Target 1: Secondary flashcard (for combo) -->
        <a-entity id="target-1" mindar-image-target="targetIndex: 1" visible="true">
            <!-- 2D Mode: Image plane -->
            <a-image id="mode-2d-1" class="clickable" position="0 0 0" rotation="0 0 0" width="1" height="1"
                visible="false">
            </a-image>

            <!-- 3D Mode: GLTF Model -->
            <a-entity id="mode-3d-1" class="clickable" position="0 0.1 0" scale="0.5 0.5 0.5" visible="true"
                animation__hover="property: scale; to: 0.55 0.55 0.55; dur: 200; startEvents: mouseenter"
                animation__leave="property: scale; to: 0.5 0.5 0.5; dur: 200; startEvents: mouseleave"
                animation__click="property: scale; from: 0.5 0.5 0.5; to: 0.6 0.6 0.6; dir: alternate; loop: 1; dur: 150; startEvents: click">
            </a-entity>
        </a-entity>
    </a-scene>

    <!-- External JS -->
    <script src="/static/ar-assets/js/ar-viewer.js"></script>
</body>

</html>
