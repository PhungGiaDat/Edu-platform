name: Deploy backend to VPS

on:
  push:
    branches:
      - 10-days-quick-run
    paths:
      - backend/**
      - Dockerfile.backend
      - docker-compose.prod.yml
      - redis.conf
      - .github/scripts/deploy-backend-vps.sh
      - .github/scripts/test-deploy-backend-vps.sh
      - .github/workflows/deploy-backend.yml

concurrency:
  group: edu-platform-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run backend release-gate tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_api_auth_required.py \
            tests/test_chat_auth.py \
            tests/test_course_start.py \
            tests/test_course_service_gamification.py \
            tests/test_learning_path_me.py \
            tests/test_lesson_activity_contract.py \
            tests/test_lesson_session_response.py \
            tests/test_gamification_idempotency.py \
            tests/test_gamification_service.py
      - name: Check VPS deployment script
        run: |
          bash -n .github/scripts/deploy-backend-vps.sh
          bash .github/scripts/test-deploy-backend-vps.sh
      - name: Validate Redis production config
        run: |
          cid="$(docker run -d --network none -v "$PWD/redis.conf:/usr/local/etc/redis/redis.conf:ro" redis:7-alpine redis-server /usr/local/etc/redis/redis.conf --maxmemory 192mb --maxmemory-policy noeviction)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..10}; do
            if [[ "$(docker exec "$cid" redis-cli ping 2>/dev/null || true)" == PONG ]]; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

  publish-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/phunggiadat/edu-platform-backend:${{ github.sha }}
            ghcr.io/phunggiadat/edu-platform-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Upload configuration and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS GHCR_TOKEN GHCR_USER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_dir="$RUNNER_TEMP/edu-platform-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/id_ed25519" -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes)
          ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/edu-platform/.incoming/$GITHUB_SHA"
          scp "${ssh_opts[@]}" -P "$VPS_PORT" docker-compose.prod.yml redis.conf .github/scripts/deploy-backend-vps.sh "$VPS_USER@$VPS_HOST:/opt/edu-platform/.incoming/$GITHUB_SHA/"
          remote="set -e; export DOCKER_CONFIG=/opt/edu-platform/.incoming/$GITHUB_SHA/.docker-auth; install -d -m 700 \"\$DOCKER_CONFIG\"; trap 'rm -f \"\$DOCKER_CONFIG/config.json\"' EXIT; docker login ghcr.io -u \"$GHCR_USER\" --password-stdin >/dev/null; bash /opt/edu-platform/.incoming/$GITHUB_SHA/deploy-backend-vps.sh $GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$remote"
