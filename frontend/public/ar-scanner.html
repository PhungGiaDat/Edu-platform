<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Scanner</title>

    <!-- Eruda Debug Console - Mobile Web Debugging -->
    <script>
        if (location.search.includes('debug') || location.hostname === 'localhost') {
            (function() {
                var s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/eruda@3';
                s.onload = function() { eruda.init({
                    defaults: { displaySize: 30, transparency: 0.8 },
                    useShadowDom: true
                }); };
                document.head.appendChild(s);
            })();
        }
    </script>

    <!-- jsQR - Lightweight QR Scanner (~50KB), vendored locally -->
    <script src="/static/vendor/jsQR-1.4.0.min.js"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="/static/ar-assets/css/ar-scanner.css">
</head>

<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- Status overlay: shown only when ?debug=true, removed once camera is ready -->
    <div id="scanner-status" style="
        display: none;
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        color: #0f0;
        font-family: monospace;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 20px;
        z-index: 9999;
        pointer-events: none;
        white-space: nowrap;
    ">⏳ Requesting camera...</div>

    <script>
        // Show status overlay only in debug mode
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('debug') === 'true') {
                document.getElementById('scanner-status').style.display = 'block';
            }
        })();
    </script>

    <!-- External JS -->
    <script src="/static/ar-assets/js/ar-scanner.js"></script>
</body>

</html>
