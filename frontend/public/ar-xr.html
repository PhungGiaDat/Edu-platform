        // Secondary asset readiness: GLB loaded + model object exists.
        // NOT dependent on model.visible (output state).
        const secondaryAssetReady = !!(
          fishInst?.modelState === 'loaded' &&
          fishInst?.model
        );
        const secondaryTracked = fishEffectivelyTracked;
        const secondaryInteractionReady = !!(
          secondaryAssetReady &&
          secondaryTracked &&
          !interactionState.comboConsumed
        );

        // Throttled diagnostic: only log when values actually change
        if (fishInst) {
          const key = `${fishInst.modelState}|${!!fishInst.model}|${!!fishInst.tracked}|${!!fishInst.visibleByInteraction}`;
          if (key !== interactionState.lastSecondaryReadiness) {
            interactionState.lastSecondaryReadiness = key;
            sendARDebug('SECONDARY_READINESS', {
              targetName: fishInst.config?.qr_id,
              modelState: fishInst.modelState,
              hasModel: !!fishInst.model,
              tracked: !!fishInst.tracked,
              modelVisible: !!fishInst.model?.visible,
              visibleByInteraction: fishInst.visibleByInteraction,
              assetReady: secondaryAssetReady,
              interactionReady: secondaryInteractionReady,
            });
          }
        }

        // Fish found → decide if we can go straight to proximity
        if (fishEffectivelyTracked && phase === InteractionPhase.WAIT_SECONDARY) {
          if (secondaryAssetReady) {
            setInteractionPhase(InteractionPhase.PROXIMITY_PENDING);
          } else {
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY_MODEL);
            sendARDebug('COMBO_WAITING_FOR_SECONDARY_MODEL', {
              targetName: fishInst?.config?.qr_id,
              modelState: fishInst?.modelState,
              hasModel: !!fishInst?.model,
            });
          }
        }

        // Fish leaves → drop back to WAIT_SECONDARY
        if (!fishEffectivelyTracked) {
          if (
            phase === InteractionPhase.PROXIMITY_PENDING ||
            phase === InteractionPhase.WAIT_SECONDARY_MODEL
          ) {
            interactionState.proximityEnteredAt = null;
            updateFilteredDistance(null);
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY);
          }
        }

        // Fish asset became ready mid-session → reset proximity timer
        if (secondaryAssetReady && phase === InteractionPhase.WAIT_SECONDARY_MODEL) {
          interactionState.proximityEnteredAt = null;
          interactionState.filteredDistance = null;
          sendARDebug('SECONDARY_INTERACTION_READY', {
            targetName: fishInst.config.qr_id,
            modelState: fishInst.modelState,
          });
          setInteractionPhase(InteractionPhase.PROXIMITY_PENDING);
        }

        const comboConfig = getInteractionConfig();
        if (!comboConfig) return;

        const raw = computeAnchorDistance();
        const filtered = updateFilteredDistance(raw);

        // Throttled proximity log
        const sampleInterval = 1000 / INTERACTION_CONFIG.proximitySampleHz;
        if (raw != null && (now - interactionState.lastProximityLog) >= sampleInterval) {
          interactionState.lastProximityLog = now;
          sendARDebug('PROXIMITY_SAMPLE', {
            rawDistance: Number(raw.toFixed(4)),
            filteredDistance: filtered != null ? Number(filtered.toFixed(4)) : null,
            enterDistance: comboConfig.distance.enter,
            exitDistance: comboConfig.distance.exit,
            catTracked: catEffectivelyTracked,
            fishTracked: fishEffectivelyTracked,
            secondaryInteractionReady,
          });
        }

        // ---- Proximity enter / stable / combo arm ----
        if (filtered != null && catEffectivelyTracked && fishEffectivelyTracked && !interactionState.comboPlaying) {
          const gate = advanceComboProximityGate({
            now,
            distance: filtered,
            enteredAt: interactionState.proximityEnteredAt,
            comboConsumed: interactionState.comboConsumed,
            config: {
              enterDistance: comboConfig.distance.enter,
              exitDistance: comboConfig.distance.exit,
              proximityStableMs: comboConfig.proximityStableMs,
            },
          });
          if (!interactionState.comboConsumed) {
            if (gate.enteredAt != null && interactionState.proximityEnteredAt == null) {
              interactionState.proximityEnteredAt = now;
              sendARDebug('PROXIMITY_ENTER', { filteredDistance: Number(filtered.toFixed(4)) });
            }
            if (gate.enteredAt == null && interactionState.proximityEnteredAt != null) {
              sendARDebug('PROXIMITY_EXIT', { filteredDistance: Number(filtered.toFixed(4)) });
            }
            interactionState.proximityEnteredAt = gate.enteredAt;
            const stableFor = gate.enteredAt == null ? 0 : now - gate.enteredAt;
            if (
              phase === InteractionPhase.PROXIMITY_PENDING &&
              secondaryInteractionReady &&
              gate.stable &&
              !interactionState.comboConsumed
            ) {
              sendARDebug('PROXIMITY_STABLE', { stableMs: stableFor, distance: Number(filtered.toFixed(4)) });
              sendARDebug('COMBO_ARMED', { targetName: primaryModelTargetName });

              // CAT_EAT owns the mixer at priority 100.
              cancelActiveCatOneShotForCombo();

              // Capture comboRunId
              interactionState.comboRunId++;
              const runId = interactionState.comboRunId;

              // Latch anchor poses
              const catPose = trackedTargets.get(primaryModelTargetName);
              const fishPose = trackedTargets.get(fishInst?.config?.qr_id);

              // Capture secondary target name for delayed-consume
              const secondaryName = fishInst?.config?.qr_id || null;

              // Get current interaction-root yaw (original orientation before combo)
              const instance = catInst;
              const root = instance ? getInteractionRoot(instance) : null;
              const catOriginalYaw = root ? root.rotation.y : 0;

              interactionState.comboLatch = {
                runId,
                catPose: catPose ? { ...catPose } : null,
                fishPose: fishPose ? { ...fishPose } : null,
                secondaryTargetName: secondaryName,
                catOriginalYaw,
              };

              setInteractionPhase(InteractionPhase.COMBO_ARMED);
              sendARDebug('COMBO_TRACKING_LATCHED', {
                runId,
                primaryTargetName: primaryModelTargetName,
                secondaryTargetName: secondaryName,
                catPose: catPose?.position,
                fishPose: fishPose?.position,
                catOriginalYawDeg: (catOriginalYaw * 180 / Math.PI).toFixed(1),
              });

              // ---- Begin turn: calculate direction from latched poses ----
              const catAnchor = instance?.anchor;
              const fishAnchor = fishInst?.anchor;
              let targetYaw = 0;
              if (catAnchor && fishAnchor) {
                const catWorld = new THREE.Vector3();
                const fishWorld = new THREE.Vector3();
                catAnchor.getWorldPosition(catWorld);
                fishAnchor.getWorldPosition(fishWorld);
                targetYaw = yawFromForward(catWorld, fishWorld) + (COMBO_VISUAL_CONFIG.forwardYawOffsetDeg * Math.PI / 180);

                // Clamp to max body yaw
                const maxRad = COMBO_VISUAL_CONFIG.maxBodyYawDeg * Math.PI / 180;
                if (targetYaw > maxRad) targetYaw = maxRad;
                if (targetYaw < -maxRad) targetYaw = -maxRad;
              }

              setInteractionPhase(InteractionPhase.COMBO_TURNING);
              sendARDebug('CAT_TURN_START', {
                runId,
                secondaryTargetName: secondaryName,
                requestedYawDeg: ((targetYaw - catOriginalYaw) * 180 / Math.PI).toFixed(1),
                clampedYawDeg: ((targetYaw) * 180 / Math.PI).toFixed(1),
              });
              interactionState.catTurn = {
                runId,
                fromYaw: catOriginalYaw,
                toYaw: targetYaw,
                startedAt: now,
                durationMs: COMBO_VISUAL_CONFIG.bodyTurnMs,
              };
              interactionState.comboPlaying = true;
            }
          }

          // Rearm when cards separate beyond EXIT
          if (
            gate.rearmEligible &&
            phase === InteractionPhase.COMBO_CONSUMED
          ) {
            sendARDebug('COMBO_REARMED', { distance: Number(filtered.toFixed(4)) });
            interactionState.comboConsumed = false;
            interactionState.proximityEnteredAt = null;
            for (const [name, inst] of targetInstances) {
              if (name === primaryModelTargetName) continue;
              inst.visibleByInteraction = true;
              if (inst.model && inst.tracked) inst.model.visible = true;
            }
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY);
          }
        }
      }
    }

    // ========== TARGET FOUND / LOST ==========
    function onTargetFound(detail) {
      saveTargetPose(detail);
      const instance = targetInstances.get(detail.name);
      const wasPendingGrace = instance && interactionState.pendingGraceHides.has(detail.name);
      const lostForMs = wasPendingGrace
        ? performance.now() - interactionState.pendingGraceHides.get(detail.name)
        : null;

      if (instance) {
        instance.tracked = true;
        instance.lostAt = null;
        if (instance.foundAt == null) instance.foundAt = performance.now();
        // If model was already loaded before this FOUND event, mark ready immediately.
        if (detail.name !== primaryModelTargetName && instance.modelState === 'loaded' && instance.model) {
          instance.interactionReady = true;
        }
      }

      // Cancel any pending grace hide and keep model visible
      if (wasPendingGrace) {
        interactionState.pendingGraceHides.delete(detail.name);
        sendARDebug('TARGET_REACQUIRED_WITHIN_GRACE', {
          targetName: detail.name,
          lostForMs: Math.round(lostForMs),
        });
      }

      const config = targetConfigByName.get(detail.name);
      const targetWord = config?.word || detail.name;

      sendARDebug('TARGET_FOUND', {
        qrId: detail.name,
        word: targetWord,
        trackedCount: trackedTargets.size,
        trackedTargets: Array.from(trackedTargets.keys()),
      });
      sendMessage('TARGET_FOUND', { qrId: detail.name, word: targetWord, trackedCount: trackedTargets.size });
      showCardLabel(targetWord);

      // Primary target: legacy singleton attach path (preserves CAT_IDLE mixer, etc.)
      if (detail.name === primaryModelTargetName) {
        resetCatAmbientIdle('target_acquired');
        attemptModelAttach(detail.name);
      } else {
        // Non-primary: reuse the already-preloaded promise (concurrent preload started in main()).
        // Never call GLTFLoader.load again — ensureTargetModelLoaded is a no-op if a promise exists.
        ensureTargetModelLoaded(detail.name).then(model => {
          if (!model) return;
          const inst = targetInstances.get(detail.name);
          if (!inst) return;
          if (scene && inst.anchor && inst.offsetGroup) {
            reparentModelToAnchor(inst);
          }
          // Only show if target is still tracked AND interaction allows visibility.
          // Guard against lost-during-preload AND combo-consume state.
          if (inst.tracked && trackedTargets.has(detail.name) && inst.visibleByInteraction) {
            const pose = trackedTargets.get(detail.name);
            if (pose) applyTargetPose(inst, pose);
            inst.model.visible = true;
            // Mark interaction-ready so combo can fire only after model is visible.
            inst.interactionReady = true;
            sendARDebug('TARGET_MODEL_ATTACH', {
              targetName: detail.name,
              source: inst.modelState === 'loaded' ? 'preloaded' : 'pending-preload',
              interactionReady: true,
            });
          }
        });
      }

      sendARDebug('MULTI_TARGET_STATE', { count: trackedTargets.size, targets: Array.from(trackedTargets.keys()) });
    }

    function onTargetLost(name) {
      const instance = targetInstances.get(name);
      const now = performance.now();

      // Track loss immediately
      trackedTargets.delete(name);
      if (instance) {
        instance.tracked = false;
        instance.pose = null;
        instance.lostAt = now;
        // DO NOT hide model immediately — visual grace handled in evaluateInteraction
        // after lostGraceMs expires.  This preserves cat visibility during
        // brief occlusion and during COMBO_PLAYING.
      }

      // Register pending grace hide
      interactionState.pendingGraceHides.set(name, now);

      sendARDebug('TARGET_LOST_PENDING', {
        qrId: name,
        graceMs: INTERACTION_CONFIG.lostGraceMs,
        isPrimary: name === primaryModelTargetName,
      });
      sendMessage('TARGET_LOST', { qrId: name });

      // For primary target, also clear modelAttached so reattach works on reacquire
      if (activeTargetName === name) {
        activeTargetName = null;
        modelAttached = false;
        // Do NOT hide model here — evaluateInteraction handles it after grace
      }

      sendARDebug('MULTI_TARGET_STATE', { count: trackedTargets.size, targets: Array.from(trackedTargets.keys()), lost: name });
    }

    // ========== COMBO DETECTION (background) ==========
    async function loadComboRules() {
      const deck = params.get('deck_id') || 'claymorphic-animals-001';
      try {
        const url = `${apiBase}/api/v1/combos/rules?flashcard_set=${encodeURIComponent(deck)}`;
        const res = await fetch(url);
        if (res.ok) {
          comboRules = (await res.json()).rules || [];
          sendARDebug('COMBO_RULE_LOAD_COMPLETE', { count: comboRules.length, url });
        }
        else sendARDebug('COMBO_RULE_LOAD_ERROR', { status: res.status });
      } catch (e) {
        sendARDebug('COMBO_RULE_LOAD_ERROR', { error: String(e) });
      } finally {
        resolveActiveComboRule();
      }
    }

    // ========== MESSAGE LISTENER ==========
    window.addEventListener('message', (event) => {
      const { type, payload } = event.data || {};
      if (!type) return;

      if (type === 'REQUEST_IFRAME_LOGS') {
        window.parent.postMessage({ type: 'IFRAME_LOGS', payload: { requestId: payload?.requestId || 'unknown', logs: window.XRDebug?.getLogs() || '', engine: '8th-wall', qrId, word }, timestamp: Date.now() }, '*');
        return;
      }
      if (type === 'DEBUG_TOGGLE') { debugPanel.style.display = payload?.enabled ? 'block' : 'none'; return; }
      if (type === 'TRIGGER_TELEGRAM_SYNC') {
        const fullLogs = `=== STATE ===\nqrId: ${qrId}\nword: ${word}\nprimaryModelLoaded: ${!!loadedModel}\nprimaryModelVisible: ${loadedModel?.visible || false}\ntrackedTargets: ${Array.from(trackedTargets.keys()).join(', ') || 'none'}\nmodelLoadState: ${modelLoadState}\ncurrentPhase: ${currentPhase}`;
        window.parent.postMessage({ type: 'TELEGRAM_SYNC_READY', payload: { logs: fullLogs, manualOffset: payload?.manualOffset, engine: '8th-wall', flashcardCount: trackedTargets.size || 1 }, timestamp: Date.now() }, '*');
        return;
      }
      logToBuffer('debug', 'Message received', { type });
    });

    // ========== STAGED MODEL PRELOAD ==========
    // Phase 1: load primary model immediately (cat — user expects this first).
    // Phase 2: after primary completes, begin secondary preloads (fish) in background.
    // Never initiate new downloads from IMAGE_FOUND — reuse existing promises.

    function preloadSecondaryTargets() {
      const secondary = xrTargetConfigs.filter(
        cfg => cfg.qr_id !== primaryModelTargetName && cfg.model_3d_url
      );
      if (secondary.length === 0) return;
      sendARDebug('SECONDARY_PRELOAD_BATCH_START', {
        targets: secondary.map(c => c.qr_id),
      });
      secondary.forEach(cfg => ensureTargetModelLoaded(cfg.qr_id));
    }

    // ========== MAIN ==========
    async function main() {
      sendARDebug('PAGE_LOAD');
      try {
        initThree();
        updateDebug('Three.js ready');
        loadComboRules();

        const targetsPromise = Promise.all(xrTargetConfigs.map(cfg => loadTargetData(cfg)));

        // Phase 1: preload primary model immediately — no await.
        sendARDebug('MODEL_PRIMARY_PRELOAD_START', { targetName: primaryModelTargetName });
        const primaryModelPromise = ensureTargetModelLoaded(primaryModelTargetName);
        primaryModelPromise.then(() => {
          sendARDebug('PRIMARY_MODEL_READY', { targetName: primaryModelTargetName });
          // Phase 2: kick off secondary preloads after primary is ready.
          preloadSecondaryTargets();
        });

        const targetDataList = await targetsPromise;
        sendARDebug('MULTI_TARGET_DATA_READY', { count: targetDataList.length, targets: targetDataList.map(t => t.name) });

        setPhase('loading');
        sendARDebug('LOADING_ASSETS', { hasModel: !!modelUrl, targetCount: targetDataList.length });

        // XR init must NOT wait for model downloads.
        await initXR(targetDataList);

        setPhase('viewing');
        sendARDebug('INIT_COMPLETE', { modelLoaded: !!loadedModel, targetCount: targetDataList.length });

        // Attach CAT gesture handlers — pointer events work for touch and mouse.
        window.addEventListener('pointerdown', onPointerDown, { passive: true });
        window.addEventListener('pointerup', onPointerUp, { passive: true });
        window.addEventListener('pointercancel', onPointerCancel, { passive: true });
        sendARDebug('CAT_GESTURE_HANDLERS_REGISTERED', {});
        logToBuffer('info', 'Initialization complete');
      } catch (error) {
        setPhase('error');
        sendARDebug('INIT_ERROR', { error: String(error), stack: error?.stack });
        logToBuffer('error', 'Initialization failed', { error: String(error) });
        showError(String(error));
      }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
    else main();
  </script>
</body>
</html>
