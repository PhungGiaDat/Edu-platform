<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall AR - Claymorphic Flashcards</title>

  <link rel="preconnect" href="https://rofprrtoeyirssfndxag.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <script>
    var xrDebugParams = new URLSearchParams(location.search);
    if (xrDebugParams.get('eruda') === 'true' || xrDebugParams.get('debug') === 'true' || location.hostname === 'localhost') {
      (function() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda@3';
        s.onload = function() { eruda.init({ defaults: { displaySize: 30, transparency: 0.8 }, useShadowDom: true }); };
        document.head.appendChild(s);
      })();
    }
  </script>

  <script>
    (function installViewerDebugBridge() {
      var params = new URLSearchParams(location.search);
      if (params.get('debug') !== 'true' && location.hostname !== 'localhost') return;

      try {
        window.parent.postMessage({
          type: 'AR_DEBUG',
          payload: {
            label: 'VIEWER_JS_ALIVE',
            details: { ts: Date.now(), href: location.href, ua: navigator.userAgent.substring(0, 80) },
            source: 'ar-viewer-console',
          },
          timestamp: Date.now(),
          origin: 'child'
        }, '*');
      } catch (_) {}

      function sendDebug(label, details) {
        try {
          window.parent.postMessage({
            type: 'AR_DEBUG',
            payload: { label: label, details: details || {}, source: 'ar-viewer-console' },
            timestamp: Date.now(),
            origin: 'child'
          }, '*');
        } catch (_) {}
      }

      // Keep this bridge available before any module import. If the main AR
      // module fails to resolve, the probes below can still report the cause.
      window.__arSendDebug = sendDebug;

      window.addEventListener('securitypolicyviolation', function(event) {
        sendDebug('CSP_VIOLATION', {
          blockedURI: event.blockedURI || null,
          violatedDirective: event.violatedDirective || null,
          effectiveDirective: event.effectiveDirective || null,
          sourceFile: event.sourceFile || null,
          lineNumber: event.lineNumber || null,
          columnNumber: event.columnNumber || null,
        });
      });

      function serialise(args) {
        return Array.prototype.slice.call(args).map(function(value) {
          try {
            if (value instanceof Error) return value.stack || value.message;
            return typeof value === 'object' ? JSON.stringify(value) : String(value);
          } catch (_) { return String(value); }
        }).join(' ').slice(0, 4000);
      }

      ['error', 'warn', 'log', 'info'].forEach(function(level) {
        var original = console[level].bind(console);
        console[level] = function() {
          try { sendDebug('VIEWER_CONSOLE_' + level.toUpperCase(), { level: level, text: serialise(arguments), engine: '8th-wall' }); } catch (_) {}
          return original.apply(console, arguments);
        };
      });

      window.addEventListener('error', function(event) {
        var el = event.target;
        sendDebug('VIEWER_ERROR', {
          message: event.message || null,
          error: event.error && (event.error.stack || event.error.message) || null,
          filename: event.filename || null,
          line: event.lineno || null,
          column: event.colno || null,
          tag: el && el.tagName || null,
          src: el && (el.src || el.href) || null,
        });
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        sendDebug('VIEWER_UNHANDLED_REJECTION', { level: 'error', text: reason instanceof Error ? (reason.stack || reason.message) : String(reason) });
      });

      console.info('[ar-xr] Debug bridge installed');
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #camerafeed { display: block; width: 100%; height: 100%; }
    #model-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); color: #fff; z-index: 100; transition: opacity 0.3s ease; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #4ecdc4; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 18px; margin-bottom: 8px; text-align: center; }
    #hint-text { font-size: 14px; opacity: 0.6; text-align: center; }
    #error-text { color: #FF6B6B; font-size: 14px; margin-top: 16px; text-align: center; max-width: 280px; }
    #card-label { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 18px; font-weight: 600; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
    #card-label.visible { opacity: 1; }
    #debug-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: #0f0; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-family: monospace; z-index: 200; display: none; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="camerafeed"></canvas>
    <canvas id="model-canvas"></canvas>
  </div>
  <div id="overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading 8th Wall Engine...</div>
    <div id="hint-text">Point camera at flashcard</div>
    <div id="error-text"></div>
  </div>
  <div id="card-label"></div>
  <div id="debug-panel">
    <div id="debug-status">Initializing...</div>
    <div id="debug-engine">Engine: 8th Wall (self-hosted)</div>
  </div>

  <script
    id="xr8-engine-script"
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async
    crossorigin="anonymous">
  </script>

  <script>
    (function installXr8ScriptProbe() {
      var xrScript = document.getElementById('xr8-engine-script');
      var debug = window.__arSendDebug;
      if (!xrScript || typeof debug !== 'function') return;

      xrScript.addEventListener('load', function() {
        debug('XR8_SCRIPT_LOAD', { hasXR8: !!window.XR8 });
      });

      xrScript.addEventListener('error', function(event) {
        debug('XR8_SCRIPT_ERROR', { src: xrScript.src, type: event.type });
      });
    })();
  </script>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/" } }
  </script>

  <script type="module">
    const debug = (label, details = {}) => window.__arSendDebug?.(label, details);

    debug('MODULE_PROBE_START');

    try {
      await import('three');
      debug('MODULE_PROBE_THREE_OK');
    } catch (error) {
      debug('MODULE_PROBE_THREE_FAIL', {
        error: error?.stack || error?.message || String(error),
      });
    }

    try {
      await import('three/addons/loaders/GLTFLoader.js');
      debug('MODULE_PROBE_GLTF_OK');
    } catch (error) {
      debug('MODULE_PROBE_GLTF_FAIL', {
        error: error?.stack || error?.message || String(error),
      });
    }

    const expectedLifecycleExports = [
      'advanceCatReturnTween',
      'advanceComboProximityGate',
      'canPlayCatMeow',
      'classifyCatGesture',
      'classifyCatTap',
      'distanceBetweenPositions',
      'getConsumablePartnerTargets',
      'getEligibleCatAmbient',
      'getInteractionParticipantTargets',
      'getTargetLossGraceState',
      'hasAnimationCapability',
      'isCatOneShotCompletionOwner',
      'normalizeInteractionRule',
      'resolveInteractionAnimation',
      'resolveRuleProximityConfig',
      'selectActiveInteractionRule',
      'setInteractionPartnerVisibility',
      'shouldReplaceCatAnimation',
      'shouldRevealAR',
      'smoothstep',
    ];

    try {
      const lifecycleModule = await import('./static/ar-assets/js/ar-interaction-lifecycle.js?v=cat-interactions-v2');
      const missingExports = expectedLifecycleExports.filter((name) => !(name in lifecycleModule));
      if (missingExports.length > 0) {
        debug('MODULE_PROBE_LIFECYCLE_FAIL', {
          missingExports,
          availableExports: Object.keys(lifecycleModule).sort(),
        });
      } else {
        debug('MODULE_PROBE_LIFECYCLE_OK', { exports: expectedLifecycleExports });
      }
    } catch (error) {
      debug('MODULE_PROBE_LIFECYCLE_FAIL', {
        error: error?.stack || error?.message || String(error),
      });
    }

    debug('MODULE_PROBE_COMPLETE');
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import {
      advanceCatReturnTween,
      advanceComboProximityGate,
      canPlayCatMeow,
      classifyCatGesture,
      classifyCatTap,
      distanceBetweenPositions,
      getConsumablePartnerTargets,
      getEligibleCatAmbient,
      getInteractionParticipantTargets,
      getTargetLossGraceState,
      hasAnimationCapability,
      isCatOneShotCompletionOwner,
      normalizeInteractionRule,
      resolveInteractionAnimation,
      resolveRuleProximityConfig,
      selectActiveInteractionRule,
      setInteractionPartnerVisibility,
      shouldReplaceCatAnimation,
      shouldRevealAR,
      smoothstep,
    } from './static/ar-assets/js/ar-interaction-lifecycle.js?v=cat-interactions-v2';
    window.THREE = THREE;

    // ========== RUNTIME DIAGNOSTICS ==========
    const RuntimeDiagnostics = {
      xrRunCount: 0,
      assert(condition, label) {
        if (!condition) {
          const msg = `[RUNTIME_INVARIANT VIOLATED] ${label}`;
          console.error(msg);
          sendMessage('XR_ERROR', { message: msg, stage: 'invariant' });
        }
      },
    };

    // ========== LOGGING BUFFER ==========
    const MAX_LOG_BUFFER = 500;
    const logBuffer = [];
    function logToBuffer(level, message, details = null) {
      const timestamp = new Date().toISOString().substring(11, 23);
      const entry = { timestamp, level, message, details };
      logBuffer.push(entry);
      if (logBuffer.length > MAX_LOG_BUFFER) logBuffer.shift();
      const prefix = `[${timestamp}]`;
      if (details) console.log(prefix, `[${level.toUpperCase()}]`, message, details);
      else console.log(prefix, `[${level.toUpperCase()}]`, message);
    }

    window.XRDebug = { getLogs: () => logBuffer.map(e => { const details = e.details ? ` ${JSON.stringify(e.details)}` : ''; return `${e.timestamp} [${e.level.toUpperCase()}] ${e.message}${details}`; }).join('\n'), logBuffer };

    // ========== PARAMS FROM URL ==========
    const params = new URLSearchParams(location.search);
    const qrId           = params.get('qr_id') || '';
    const modelUrl       = params.get('model_3d_url') || '';
    const targetJsonUrl  = params.get('xr_target_json_url') || '';
    const targetImageUrl = params.get('xr_target_image_url') || '';
    const word           = params.get('word') || qrId;
    const apiBase        = (params.get('api_base') || 'https://edu-platform-api-do20.onrender.com').replace(/\/+$/, '');
    const isDebug        = location.hostname === 'localhost' || params.get('debug') === 'true';

    // ========== BOOTSTRAP STATE (must exist before any sendARDebug call) ==========
    let currentPhase = 'initializing';
    let xrTargetConfigs = [];

    // ========== PER-TARGET INSTANCE STATE ==========
    // One entry per tracked QR code. scene/camera/renderer stay singletons (ONE XR scene).
    const targetInstances = new Map();
    // Primary target's singleton refs — used for the entry (scanned) target's model rendering
    let loadedModel = null, mixer = null;
    let targetAnchor = null, modelOffsetGroup = null;
    let modelWaitingForXRScene = false;
    let activeTargetName = null;

    // Scene singletons — ONE XR scene, shared by all targets
    let scene = null, camera = null, renderer = null;

    // ========== INTERACTION STATE MACHINE ==========
    // Phases:
    // SEARCH_PRIMARY → PRIMARY_LOCKED → WAIT_SECONDARY
    // → WAIT_SECONDARY_MODEL (fish found but model not yet visible)
    // → PROXIMITY_PENDING → PROXIMITY_ENTER
    // → COMBO_ARMED → COMBO_TURNING → COMBO_PLAYING → COMBO_CONSUMED
    // → (rearm on far) → WAIT_SECONDARY
    const InteractionPhase = {
      SEARCH_PRIMARY: 'SEARCH_PRIMARY',
      PRIMARY_LOCKED: 'PRIMARY_LOCKED',
      WAIT_SECONDARY: 'WAIT_SECONDARY',
      WAIT_SECONDARY_MODEL: 'WAIT_SECONDARY_MODEL',
      PROXIMITY_PENDING: 'PROXIMITY_PENDING',
      COMBO_ARMED: 'COMBO_ARMED',
      COMBO_TURNING: 'COMBO_TURNING',
      COMBO_PLAYING: 'COMBO_PLAYING',
      COMBO_CONSUMED: 'COMBO_CONSUMED',
    };

    const INTERACTION_CONFIG = {
      primaryLockMs: 400,
      proximityStableMs: 300,
      lostGraceMs: 300,
      distance: {
        enter: 0.72,
        exit: 0.80,
        smoothingAlpha: 0.25,
      },
      proximitySampleHz: 4,
      consumeAtRatio: 0.65,
    };

    // Procedural combo visual config
    const COMBO_VISUAL_CONFIG = {
      bodyTurnMs: 400,
      maxBodyYawDeg: 55,
      returnTurnMs: 400,
      forwardYawOffsetDeg: 0,
    };

    // Boot gate state
    let bootState = {
      cameraReady: false,
      catReady: false,
      catReadyAt: null,       // performance.now() when CAT finished loading
      arRevealed: false,
      fishLastProgress: 0,
      lastProgressLogPercent: 0,  // throttle to 20/40/60/80/100
    };

    // The one CAT mixer owns every CAT clip. A callback can mutate it only if
    // it still owns both the generation and exact AnimationAction it started.
    const catAnimationState = {
      generation: 0,
      action: null,
      clipName: null,
      source: null,
      priority: 0,
    };
    const catPointerGesture = {
      active: false,
      pointerId: null,
      startedAt: 0,
      startX: 0,
      startY: 0,
      hitDistance: null,
      hitSource: null,
    };
    const catAmbientState = {
      idleSince: performance.now(),
      nextClip: 'CAT_LOOK_UP',
    };

    // CAT meow audio (preloaded when CAT becomes ready)
    const CAT_AUDIO_CONFIG = {
      // Audio asset from existing project: Supabase AR_models/assets/animal/
      meowUrl: 'https://rofprrtoeyirssfndxag.supabase.co/storage/v1/object/public/AR_models/assets/animal/cat_meow.mp3',
    };
    let catMeowAudio = null;
    let catMeowAudioLoaded = false;
    let normalizedInteractionRules = [];
    let selectedInteractionRuleId = null;
    const unavailableAnimationRuleIds = new Set();

    const interactionState = {
      phase: InteractionPhase.SEARCH_PRIMARY,
      primaryLockedAt: null,
      proximityEnteredAt: null,
      filteredDistance: null,
      comboPlaying: false,
      comboConsumed: false,
      comboRunId: 0,
      // Latched state captured at COMBO_ARMED
      comboLatch: null,          // { runId, ruleId, actorTarget, partnerTargets, actorPose, partnerPose, actorOriginalYaw }
      // Procedural turn state
      actorTurn: null,          // { runId, actorTarget, fromYaw, toYaw, startedAt, durationMs }
      // Post-combo return state
      actorReturn: null,        // { runId, actorTarget, fromYaw, toYaw, startedAt, durationMs }
      actorTarget: null,
      partnerTargets: [],
      // Visual grace: targets pending hidden due to grace expiry
      pendingGraceHides: new Map(), // targetName → graceStartTime
      // Debug: last logged SECONDARY_READINESS to avoid spam
      lastSecondaryReadiness: null,
      consumeTimeoutId: null,
      lastProximityLog: 0,
    };

    // ========== MULTI-TARGET CONFIG PARSING ==========
    function parseXRTargetConfigs() {
      const raw = params.get('xr_targets');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch (error) {
          logToBuffer('error', 'XR_TARGET_CONFIG_PARSE_ERROR', { error: String(error) });
        }
      }
      return [{
        qr_id: qrId,
        word: word,
        xr_target_json_url: targetJsonUrl,
        xr_target_image_url: targetImageUrl,
        model_3d_url: modelUrl,
        animations: null,
        default_animation: null,
        combo_animation: null,
        position: null,
        rotation: null,
        scale: null,
      }];
    }

    xrTargetConfigs = parseXRTargetConfigs();

    // Populate targetInstances Map for all tracked targets
    for (const config of xrTargetConfigs) {
      targetInstances.set(config.qr_id, {
        config,
        anchor: null,
        offsetGroup: null,
        model: null,
        mixer: null,
        animations: [],
        tracked: false,
        pose: null,
        lastAttachAttempt: 0,
        modelState: 'idle', // idle | loading | loaded | error
        modelLoadStart: 0,
        pivotNormalized: false, // normalize pivot only once per model
        catInteractionProxy: null,
        // Interaction fields
        foundAt: null,
        stable: false,
        lastSeenAt: 0,
        lostAt: null,
        lossConfirmedAt: null,
        interactionReady: false,
        visibleByInteraction: true,
      });
    }

    const targetConfigByName = new Map(xrTargetConfigs.map(c => [c.qr_id, c]));
    const primaryModelTargetName = qrId;

    function isExactTargetPair(tags, first, second) {
      return Array.isArray(tags)
        && tags.length === 2
        && tags.includes(first)
        && tags.includes(second);
    }

    // Demo resilience belongs only at the configuration boundary. The fallback
    // is normalized and executed through the same generic path as backend rules.
    function withConfiguredDemoFallback(rawRules) {
      const rules = Array.isArray(rawRules) ? [...rawRules] : [];
      const hasDemoPair = targetInstances.has('cat001') && targetInstances.has('fish001');
      if (!hasDemoPair) return rules;

      const expected = {
        enter_distance: 0.52,
        exit_distance: 0.60,
        proximity_stable_ms: 300,
        smoothing_alpha: 0.25,
      };
      const validBackendRule = rules.find((rule) => (
        isExactTargetPair(rule?.tags, 'cat001', 'fish001')
        && rule?.proximity?.enter_distance === expected.enter_distance
        && rule?.proximity?.exit_distance === expected.exit_distance
        && rule?.proximity?.proximity_stable_ms === expected.proximity_stable_ms
        && rule?.proximity?.smoothing_alpha === expected.smoothing_alpha
      ));
      if (validBackendRule) return rules;

      return [
        ...rules.filter((rule) => !isExactTargetPair(rule?.tags, 'cat001', 'fish001')),
        {
          tags: ['cat001', 'fish001'],
          target_order: ['cat001', 'fish001'],
          combo_id: 'cat001-fish001-fallback',
          animation_trigger: 'CAT_EAT',
          priority: 100,
          proximity: expected,
          consume_at_ratio: 0.65,
          source: 'fallback',
        },
      ];
    }

    function installInteractionRules(rawRules) {
      normalizedInteractionRules = withConfiguredDemoFallback(rawRules)
        .map((rawRule) => normalizeInteractionRule(rawRule));
      unavailableAnimationRuleIds.clear();

      sendARDebug('INTERACTION_RULES_LOADED', {
        count: normalizedInteractionRules.length,
        executableCount: normalizedInteractionRules.filter((rule) => rule.executable).length,
      });
      for (const rule of normalizedInteractionRules) {
        sendARDebug('INTERACTION_RULE_NORMALIZED', {
          ruleId: rule.id,
          requiredTargets: rule.requiredTargets,
          executable: rule.executable,
          source: rule.source,
        });
        sendARDebug('RULE_ACTOR_RESOLVED', {
          ruleId: rule.id,
          actorTarget: rule.actorTarget,
          partnerTargets: rule.partnerTargets,
          source: rule.actorSource,
        });
        if (!rule.executable) {
          sendARDebug('INTERACTION_RULE_UNSUPPORTED', {
            ruleId: rule.id,
            requiredTargetCount: rule.requiredTargets.length,
          });
        }
        if (isExactTargetPair(rule.requiredTargets, 'cat001', 'fish001')) {
          const proximity = resolveRuleProximityConfig(rule, null);
          sendARDebug('COMBO_RULE_RESOLVED', {
            primaryTargetName: rule.actorTarget,
            secondaryTargetName: rule.partnerTargets[0] || null,
            source: rule.source,
            enterDistance: proximity?.enterDistance ?? null,
            exitDistance: proximity?.exitDistance ?? null,
            proximityStableMs: proximity?.stableMs ?? null,
            smoothingAlpha: proximity?.smoothingAlpha ?? null,
          });
        }
      }
    }

    sendARDebug('XR_MULTI_CONFIG', {
      count: xrTargetConfigs.length,
      targets: xrTargetConfigs.map(t => t.qr_id),
    });

    // ========== DOM ==========
    const overlay    = document.getElementById('overlay');
    const loadingText = document.getElementById('loading-text');
    const hintText    = document.getElementById('hint-text');
    const errorText   = document.getElementById('error-text');
    const cardLabel   = document.getElementById('card-label');
    const debugPanel  = document.getElementById('debug-panel');
    const debugStatus = document.getElementById('debug-status');
    if (isDebug) debugPanel.style.display = 'block';
    logToBuffer('info', 'ar-xr.html loaded', { qrId, isDebug });

    // ========== POST MESSAGE ==========
    function sendMessage(type, payload = {}) {
      window.parent.postMessage({ type, payload, timestamp: Date.now() }, '*');
    }

    // ========== AR_DEBUG MESSAGE ==========
    function sendARDebug(label, details = {}) {
      const debugPayload = {
        label, details, source: 'ar-xr',
        phase: currentPhase, engine: '8th-wall',
        qrId, word, xrTargetsCount: xrTargetConfigs.length,
      };
      sendMessage('AR_DEBUG', debugPayload);
      logToBuffer('debug', label, details);
    }

    function setPhase(phase) {
      const previousPhase = currentPhase;
      currentPhase = phase;
      sendARDebug('PHASE_CHANGE', { from: previousPhase, to: phase });
    }

    function showOverlay(text, hint = '') {
      overlay.classList.remove('hidden');
      loadingText.textContent = text;
      hintText.textContent = hint;
      errorText.textContent = '';
    }
    function hideOverlay() { overlay.classList.add('hidden'); }

    // ========== CAT TAP / MEOW ==========
    // Three.js Raycaster (reusable, not allocated per tap)
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const CAT_HIT_PROXY_SCALE = 1.30;

    function isCatMascotInstance(instance) {
      return hasAnimationCapability(instance, 'CAT_IDLE') && (
        hasAnimationCapability(instance, 'CAT_MEOW')
        || hasAnimationCapability(instance, 'CAT_PET_REACT')
        || hasAnimationCapability(instance, 'CAT_SPIN')
      );
    }

    // CAT gestures are a per-model capability layer. Generic pair interaction
    // never depends on CAT_MEOW or any other mascot clip.
    function canTriggerCatInteraction() {
      const catInst = targetInstances.get(primaryModelTargetName);
      if (!catInst) return false;
      if (!isCatMascotInstance(catInst)) return false;
      if (!catInst.model) return false;
      if (!catInst.mixer) return false;
      if (!catInst.model.visible) return false;
      // Must be effectively tracked (grace-ok)
      if (!catInst.tracked) return false;
      return canPlayCatMeow({
        phase: interactionState.phase,
        catReturn: interactionState.actorReturn,
        catReady: catInst.modelState === 'loaded',
        catTracked: catInst.tracked,
        catMeowing: !!catAnimationState.action,
      });
    }

    function resetCatAmbientIdle() {
      catAmbientState.idleSince = performance.now();
    }

    function getCatIdleClip(instance) {
      return instance?.animations?.find(
        clip => clip.name === (instance.config?.default_animation || 'CAT_IDLE')
      ) || instance?.animations?.find(clip => clip.name === 'CAT_IDLE');
    }

    // One-shot actions are faded out immediately after completion. There is no
    // delayed stop/reset, so an older run cannot mutate a newer AnimationAction.
    function restoreCatIdleAfterOneShot(instance, oneShotAction, source, oneShotClipName = null) {
      if (!instance?.mixer) return;

      const idleClip = getCatIdleClip(instance);
      if (!idleClip) {
        sendARDebug('CAT_IDLE_RESTORE_FAILED', {
          source,
          reason: 'idle_clip_missing',
        });
        return;
      }

      if (oneShotAction) {
        oneShotAction.fadeOut(0.12);
      }

      const idleAction = instance.mixer.clipAction(idleClip);
      idleAction.reset();
      idleAction.enabled = true;
      idleAction.fadeIn(0.12);
      idleAction.play();

      sendARDebug('CAT_IDLE_RESTORED', {
        source,
        idleClip: idleClip.name,
        oneShotClip: oneShotClipName,
      });
    }

    function cacheCatInteractionProxy(instance) {
      if (
        !instance?.model ||
        instance.config?.qr_id !== primaryModelTargetName ||
        instance.catInteractionProxy
      ) return;

      const model = instance.model;
      model.updateWorldMatrix(true, true);
      const box = new THREE.Box3().setFromObject(model);
      if (box.isEmpty()) {
        sendARDebug('CAT_INTERACTION_PROXY_FAILED', { reason: 'empty_bounds' });
        return;
      }

      const worldSphere = box.getBoundingSphere(new THREE.Sphere());
      const worldScale = model.getWorldScale(new THREE.Vector3());
      const largestWorldScale = Math.max(worldScale.x, worldScale.y, worldScale.z);
      if (!Number.isFinite(largestWorldScale) || largestWorldScale <= 0) {
        sendARDebug('CAT_INTERACTION_PROXY_FAILED', { reason: 'invalid_scale' });
        return;
      }

      const localCenter = model.worldToLocal(worldSphere.center.clone());
      const localRadius = (worldSphere.radius / largestWorldScale) * CAT_HIT_PROXY_SCALE;
      const proxy = new THREE.Mesh(
        new THREE.SphereGeometry(localRadius, 16, 12),
        new THREE.MeshBasicMaterial(),
      );
      proxy.name = 'cat-interaction-proxy';
      proxy.visible = false;
      proxy.userData.isCatInteractionProxy = true;
      proxy.position.copy(localCenter);
      model.add(proxy);
      instance.catInteractionProxy = proxy;

      sendARDebug('CAT_INTERACTION_PROXY_READY', {
        scale: CAT_HIT_PROXY_SCALE,
        radius: Number(localRadius.toFixed(4)),
      });
    }

    // Preload meow audio when CAT becomes ready.
    function preloadCatMeowAudio() {
      if (!CAT_AUDIO_CONFIG.meowUrl || catMeowAudioLoaded) return;
      try {
        catMeowAudio = new Audio(CAT_AUDIO_CONFIG.meowUrl);
        catMeowAudio.preload = 'auto';
        catMeowAudio.playsInline = true;
        catMeowAudio.load();
        catMeowAudioLoaded = true;
        sendARDebug('CAT_MEOW_AUDIO_PRELOADED', { url: CAT_AUDIO_CONFIG.meowUrl });
      } catch (e) {
        sendARDebug('CAT_MEOW_AUDIO_PRELOAD_ERROR', { error: String(e) });
      }
    }

    function describeAudioError(error) {
      return {
        name: error?.name || null,
        message: error?.message || String(error),
        mediaErrorCode: catMeowAudio?.error?.code || null,
        mediaErrorMessage: catMeowAudio?.error?.message || null,
      };
    }

    // This function is always called synchronously from a valid CAT pointer
    // gesture. Audio errors are telemetry only and never affect animation.
    function requestCatMeowAudio() {
      if (!catMeowAudio || catMeowAudio.error) {
        catMeowAudio = new Audio(CAT_AUDIO_CONFIG.meowUrl);
        catMeowAudio.preload = 'auto';
        catMeowAudio.playsInline = true;
      }
      let playbackOutcomeReported = false;
      const reportPlaying = () => {
        if (playbackOutcomeReported) return;
        playbackOutcomeReported = true;
        sendARDebug('CAT_MEOW_AUDIO_PLAYING', { url: CAT_AUDIO_CONFIG.meowUrl });
      };
      const reportError = error => {
        if (playbackOutcomeReported) return;
        playbackOutcomeReported = true;
        sendARDebug('CAT_MEOW_AUDIO_PLAY_ERROR', describeAudioError(error));
      };

      try {
        catMeowAudio.currentTime = 0;
        catMeowAudio.addEventListener('playing', reportPlaying, { once: true });
        catMeowAudio.addEventListener('error', () => reportError(catMeowAudio.error), { once: true });
        sendARDebug('CAT_MEOW_AUDIO_REQUESTED', { url: CAT_AUDIO_CONFIG.meowUrl });
        const playPromise = catMeowAudio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(reportPlaying).catch(reportError);
        }
      } catch (error) {
        reportError(error);
      }
    }

    function emitCatOneShotStart(source, clip, generation) {
      const details = {
        targetName: primaryModelTargetName,
        clip: clip.name,
        generation,
        durationMs: Math.round((clip.duration || 0) * 1000),
      };
      if (source === 'CAT_MEOW') sendARDebug('CAT_MEOW_START', details);
      if (source === 'CAT_PET_REACT') sendARDebug('CAT_PET_REACT_START', details);
      if (source === 'CAT_SPIN') sendARDebug('CAT_SPIN_START', details);
      if (source === 'CAT_AMBIENT') sendARDebug('CAT_AMBIENT_START', { clip: clip.name, generation });
    }

    function emitCatOneShotFinished(source, clip, generation) {
      if (source === 'CAT_MEOW') sendARDebug('CAT_MEOW_FINISHED', { generation });
      if (source === 'CAT_PET_REACT') sendARDebug('CAT_PET_REACT_FINISHED', { generation });
      if (source === 'CAT_SPIN') sendARDebug('CAT_SPIN_FINISHED', { generation });
      if (source === 'CAT_AMBIENT') sendARDebug('CAT_AMBIENT_FINISHED', { clip: clip.name, generation });
    }

    function cancelActiveCatOneShotForCombo() {
      if (!catAnimationState.action) return;
      const cancelled = {
        generation: catAnimationState.generation,
        source: catAnimationState.source,
        clipName: catAnimationState.clipName,
      };
      catAnimationState.generation++;
      catAnimationState.action.fadeOut(0.12);
      catAnimationState.action = null;
      catAnimationState.clipName = null;
      catAnimationState.source = null;
      catAnimationState.priority = 0;
      sendARDebug('CAT_ONE_SHOT_CANCELLED_FOR_COMBO', cancelled);
    }

    function playCatOneShot({ clipName, source, priority, audio = false }) {
      const catInst = targetInstances.get(primaryModelTargetName);
      if (!catInst || !catInst.mixer) return false;
      if (!hasAnimationCapability(catInst, clipName)) return false;
      const clip = catInst.animations?.find(candidate => candidate.name === clipName);
      if (!clip) {
        sendARDebug('CAT_ONE_SHOT_CLIP_MISSING', { source, clipName });
        return false;
      }
      if (catAnimationState.action) {
        if (!shouldReplaceCatAnimation({ currentPriority: catAnimationState.priority, nextPriority: priority })) {
          return false;
        }
        catAnimationState.generation++;
        catAnimationState.action.fadeOut(0.12);
      }

      catAnimationState.generation++;
      const generation = catAnimationState.generation;
      const action = catInst.mixer.clipAction(clip);
      catAnimationState.action = action;
      catAnimationState.clipName = clip.name;
      catAnimationState.source = source;
      catAnimationState.priority = priority;

      const idleClip = getCatIdleClip(catInst);
      if (idleClip) {
        const idleAction = catInst.mixer.clipAction(idleClip);
        idleAction.fadeOut(0.12);
      }
      action.reset();
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.fadeIn(0.12);
      action.play();
      emitCatOneShotStart(source, clip, generation);
      if (audio) requestCatMeowAudio();

      const onFinished = (event) => {
        if (event.action !== action) return;
        catInst.mixer.removeEventListener('finished', onFinished);
        if (!isCatOneShotCompletionOwner({
          capturedGeneration: generation,
          capturedAction: action,
          current: catAnimationState,
        })) {
          sendARDebug('CAT_ONE_SHOT_FINISH_IGNORED_STALE', {
            generation,
            currentGeneration: catAnimationState.generation,
            source,
          });
          return;
        }
        catAnimationState.action = null;
        catAnimationState.clipName = null;
        catAnimationState.source = null;
        catAnimationState.priority = 0;
        emitCatOneShotFinished(source, clip, generation);
        if (source === 'CAT_AMBIENT') {
          catAmbientState.nextClip = clip.name === 'CAT_LOOK_UP' ? 'CAT_SIT' : 'CAT_LOOK_UP';
        }
        restoreCatIdleAfterOneShot(catInst, action, source, clip.name);
        if (source === 'CAT_AMBIENT') resetCatAmbientIdle('ambient_complete');
      };
      catInst.mixer.addEventListener('finished', onFinished);
      return true;
    }

    function playCatMeow() {
      return playCatOneShot({
        clipName: 'CAT_MEOW',
        source: 'CAT_MEOW',
        priority: 60,
        audio: true,
      });
    }

    function playCatPetReact() {
      return playCatOneShot({ clipName: 'CAT_PET_REACT', source: 'CAT_PET_REACT', priority: 60 });
    }

    function playCatSpin() {
      return playCatOneShot({ clipName: 'CAT_SPIN', source: 'CAT_SPIN', priority: 60 });
    }

    // Pointer event handler — records hit eligibility and classifies on pointerup.
    function onPointerDown(event) {
      // Ignore UI interactions
      if (event.target.closest?.('#overlay, #debug-panel, button, input')) return;
      // Guard: renderer must be acquired before we can raycast
      if (!renderer?.domElement) return;

      // Only check CAT when AR is visible and CAT exists
      const catInst = targetInstances.get(primaryModelTargetName);
      if (!catInst?.model) return;

      // Compute NDC pointer
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNdc, camera);

      // Mesh stays authoritative. The cached invisible proxy only handles
      // near-misses around the CAT body and is never raycast as part of a scene.
      const meshHits = raycaster.intersectObject(catInst.model, true)
        .filter(hit => !hit.object.userData.isCatInteractionProxy);
      const meshHit = meshHits[0] || null;
      const proxyHits = !meshHit && catInst.catInteractionProxy
        ? raycaster.intersectObject(catInst.catInteractionProxy, false)
        : [];
      const proxyHit = proxyHits[0] || null;
      const hitSource = classifyCatTap({
        meshHit: !!meshHit,
        proxyHit: !!proxyHit,
      });
      if (hitSource === 'miss') {
        sendARDebug('CAT_TAP_MISS', { x: event.clientX, y: event.clientY });
        return;
      }

      const hitDistance = (meshHit || proxyHit).distance;
      if (!canTriggerCatInteraction()) {
        const phase = interactionState.phase;
        const reason = catAnimationState.action
          ? 'already_playing'
          : interactionState.actorReturn
            ? 'returning'
          : phase === InteractionPhase.COMBO_ARMED || phase === InteractionPhase.COMBO_TURNING || phase === InteractionPhase.COMBO_PLAYING
            ? 'combo_busy'
            : 'not_ready';
        sendARDebug('CAT_GESTURE_IGNORED', { reason, phase });
        return;
      }
      catPointerGesture.active = true;
      catPointerGesture.pointerId = event.pointerId;
      catPointerGesture.startedAt = performance.now();
      catPointerGesture.startX = event.clientX;
      catPointerGesture.startY = event.clientY;
      catPointerGesture.hitDistance = hitDistance;
      catPointerGesture.hitSource = hitSource;
    }

    function onPointerUp(event) {
      if (!catPointerGesture.active || event.pointerId !== catPointerGesture.pointerId) return;
      const durationMs = performance.now() - catPointerGesture.startedAt;
      const dx = event.clientX - catPointerGesture.startX;
      const dy = event.clientY - catPointerGesture.startY;
      const hitDistance = catPointerGesture.hitDistance;
      catPointerGesture.active = false;
      catPointerGesture.pointerId = null;

      const gesture = classifyCatGesture({ durationMs, dx, dy });
      if (gesture === 'none' || !canTriggerCatInteraction()) {
        if (gesture === 'none') sendARDebug('CAT_GESTURE_NONE', { durationMs, dx, dy });
        return;
      }
      if (gesture === 'tap') {
        sendARDebug('CAT_GESTURE_TAP', { durationMs, dx, dy, hitDistance });
        if (playCatMeow()) resetCatAmbientIdle('user_interaction');
      }
      if (gesture === 'pet') {
        sendARDebug('CAT_GESTURE_LONG_PRESS', { durationMs, dx, dy, hitDistance });
        if (playCatPetReact()) resetCatAmbientIdle('user_interaction');
      }
      if (gesture === 'swipe') {
        sendARDebug('CAT_GESTURE_SWIPE', { durationMs, dx, dy, hitDistance });
        if (playCatSpin()) resetCatAmbientIdle('user_interaction');
      }
    }

    function onPointerCancel(event) {
      if (event.pointerId !== catPointerGesture.pointerId) return;
      catPointerGesture.active = false;
      catPointerGesture.pointerId = null;
    }

    function updateCatAmbient(now) {
      const catInst = targetInstances.get(primaryModelTargetName);
      if (
        !catInst?.model ||
        catInst.modelState !== 'loaded' ||
        !catInst.tracked ||
        !catInst.model.visible
      ) return;
      const clipName = getEligibleCatAmbient({
        now,
        idleSince: catAmbientState.idleSince,
        nextClip: catAmbientState.nextClip,
        activeOneShot: !!catAnimationState.action,
        pointerGestureActive: catPointerGesture.active,
        catReturn: interactionState.actorReturn,
        phase: interactionState.phase,
      });
      if (clipName) playCatOneShot({ clipName, source: 'CAT_AMBIENT', priority: 20 });
    }

    // ========== BOOT GATE ==========
    // Controls when the AR experience is revealed to the user.
    // XR camera/engine runs in the background — this only gates visual experience.
    function maybeRevealAR({ trigger } = {}) {
      if (bootState.arRevealed) return;
      if (!shouldRevealAR({
        cameraReady: bootState.cameraReady,
        catReady: bootState.catReady,
      })) return;

      bootState.arRevealed = true;
      sendARDebug('BOOT_GATE_OPEN', {
        trigger,
        cameraReady: bootState.cameraReady,
        catReady: bootState.catReady,
        fishProgress: bootState.fishLastProgress,
      });
      hideOverlay();
      setPhase('viewing');
    }

    // Update overlay text based on boot state
    function updateOverlayForBoot(catProgress) {
      if (bootState.arRevealed) return;
      if (!bootState.catReady) {
        const text = catProgress != null ? `Loading cat... (${catProgress}%)` : 'Loading cat...';
        showOverlay(text, '');
      } else {
        showOverlay('Starting camera...', '');
      }
    }
    function showError(msg) { errorText.textContent = msg; logToBuffer('error', 'Error shown to user', { message: msg }); }
    function updateDebug(text) { debugStatus.textContent = text; }
    function showCardLabel(name) {
      cardLabel.textContent = name;
      cardLabel.classList.add('visible');
      setTimeout(() => cardLabel.classList.remove('visible'), 3000);
    }

    // ========== UTILITIES ==========
    function parseVector(str, fallback) {
      if (!str) return fallback;
      const parts = str.split(' ').map(Number);
      return [parts[0] ?? fallback[0], parts[1] ?? fallback[1], parts[2] ?? fallback[2]];
    }
    function parseScale(str) {
      if (!str) return 1;
      const n = parseFloat(str.trim());
      return isNaN(n) ? 1 : n;
    }

    // ========== THREE.JS STUB ==========
    function initThree() {
      logToBuffer('info', 'Three.js stubs ready — scene/camera/renderer acquired from XR8');
    }

    // ========== MODEL LOADING ==========
    let modelLoadState = 'pending';
    let modelLoadProgressShown = false;
    const modelPromiseCache = new Map();

    function loadModel(url, targetName) {
      const loadStartMs = performance.now();
      sendARDebug('MODEL_LOAD_START', { url, targetName });
      modelLoadState = 'loading';

      return new Promise((resolve, reject) => {
        const loader = new GLTFLoader();
        loader.load(url,
          (gltf) => {
            const model = gltf.scene;
            model.visible = false;
            model.name = targetName;

            // Claymorphic material
            model.traverse((child) => {
              if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);

            // Get per-target config (defaults from URL params for primary)
            const instance = targetInstances.get(targetName);
            const cfg = instance?.config || {};
            const pos = parseVector(cfg.position, [0, 0, -0.5]);
            const rot = parseVector(cfg.rotation, [0, 0, 0]);
            const sc  = parseScale(cfg.scale || params.get('scale') || '1');

            model.position.set(pos[0], pos[1], pos[2]);
            model.rotation.set(rot[0], rot[1], rot[2]);
            model.scale.setScalar(sc);

            // Attach model to the instance AND (for primary) to singleton globals
            if (instance) {
              instance.model = model;
              instance.modelState = 'loaded';
            }
            if (targetName === primaryModelTargetName) {
              loadedModel = model;
            }

            modelLoadState = 'loaded';

            // Animations
            let instanceMixer = null;
            if (gltf.animations?.length > 0) {
              instanceMixer = new THREE.AnimationMixer(model);
              const defaultClip = gltf.animations.find(a => a.name.toUpperCase().includes('IDLE')) || gltf.animations[0];
              instanceMixer.clipAction(defaultClip).play();
              if (instance) {
                instance.mixer = instanceMixer;
                instance.animations = gltf.animations;
              }
              if (targetName === primaryModelTargetName) mixer = instanceMixer;
              logToBuffer('info', 'Animations available', { targetName, animations: gltf.animations.map(a => a.name) });
            }

            sendARDebug('MODEL_LOAD_COMPLETE', {
              url, targetName,
              animations: gltf.animations?.map(a => a.name) || [],
              position: pos, rotation: rot, scale: sc,
              boundingBox: { min: [box.min.x, box.min.y, box.min.z], max: [box.max.x, box.max.y, box.max.z], size: [size.x, size.y, size.z] },
              sceneChildren: scene?.children?.length || 0,
              xrSceneReady: !!scene,
              isPrimary: targetName === primaryModelTargetName,
            });

            // ---- Boot gate: track CAT readiness ----
            if (targetName === primaryModelTargetName && !bootState.catReady) {
              bootState.catReady = true;
              bootState.catReadyAt = performance.now();
              const durationMs = Math.round(performance.now() - loadStartMs);
              sendARDebug('BOOT_CAT_READY', { targetName: primaryModelTargetName, durationMs });
              updateOverlayForBoot(null); // update overlay text now that CAT is ready
              maybeRevealAR({ trigger: 'catReady' });
              preloadCatMeowAudio(); // preload meow audio now that CAT GLB is ready
            }

            // Network timing
            const totalMs = Math.round(performance.now() - loadStartMs);
            try {
              const entries = performance.getEntriesByName(url);
              if (entries.length > 0) {
                const last = entries[entries.length - 1];
                sendARDebug('MODEL_NETWORK_TIMING', { url, targetName, totalMs, downloadMs: Math.round(last.duration), parseMs: totalMs - Math.round(last.duration), transferSize: last.transferSize });
              }
            } catch (_) {
              sendARDebug('MODEL_NETWORK_TIMING', { url, targetName, totalMs });
            }

            // For primary target: handle XR scene readiness
            if (targetName === primaryModelTargetName) {
              if (scene && targetAnchor && modelOffsetGroup) {
                reparentModelToAnchor(instance);
                modelWaitingForXRScene = false;
              } else {
                modelWaitingForXRScene = true;
                sendARDebug('MODEL_WAITING_FOR_XR_SCENE', { hasScene: !!scene, hasTargetAnchor: !!targetAnchor, hasModelOffsetGroup: !!modelOffsetGroup });
              }

              sendARDebug('MODEL_READY_NOT_ATTACHED', {
                modelName: model.name || targetName,
                hasTargetFound: trackedTargets.size > 0,
                boundingBoxSize: [size.x, size.y, size.z],
              });

              if (trackedTargets.size > 0) {
                attemptModelAttach(Array.from(trackedTargets.keys())[0]);
              }
            }

            resolve(model);
          },
          (progress) => {
            if (progress.total && !modelLoadProgressShown) {
              const percent = Math.round(progress.loaded / progress.total * 100);
              if (percent % 20 === 0) {
                sendARDebug('MODEL_LOAD_PROGRESS', { targetName, url, percent, loaded: progress.loaded, total: progress.total });
                modelLoadProgressShown = true;
                setTimeout(() => { modelLoadProgressShown = false; }, 2000);
              }
              updateDebug(`Model ${percent}%`);

              // Track fish warmup for boot gate (non-primary targets only)
              if (targetName !== primaryModelTargetName) {
                bootState.fishLastProgress = percent;
                // Throttle to meaningful steps
                const steps = [20, 40, 60, 80, 100];
                const nearestStep = steps.reduce((prev, curr) =>
                  Math.abs(curr - percent) < Math.abs(prev - percent) ? curr : prev
                );
                if (nearestStep > bootState.lastProgressLogPercent && nearestStep <= percent) {
                  bootState.lastProgressLogPercent = nearestStep;
                  sendARDebug('BOOT_SECONDARY_PROGRESS', { targetName, percent: nearestStep });
                }
              }
            }
          },
          (error) => {
            modelLoadState = 'error';
            if (instance) instance.modelState = 'error';
            sendARDebug('MODEL_LOAD_ERROR', { url, targetName, name: error?.name || 'UnknownError', message: error?.message || String(error) });
            logToBuffer('error', 'Model load failed', { targetName, error: String(error) });
            reject(error);
          }
        );
      });
    }

    function ensureTargetModelLoaded(targetName) {
      const instance = targetInstances.get(targetName);
      if (!instance) return Promise.resolve(null);
      if (instance.model || instance.modelState === 'loaded') return Promise.resolve(instance.model);
      if (instance.modelState === 'loading') return new Promise(resolve => {
        const check = setInterval(() => {
          if (instance.modelState === 'loaded') { clearInterval(check); resolve(instance.model); }
          if (instance.modelState === 'error')  { clearInterval(check); resolve(null); }
        }, 50);
      });

      const modelCfgUrl = instance.config?.model_3d_url;
      if (!modelCfgUrl) return Promise.resolve(null);

      instance.modelState = 'loading';
      instance.modelLoadStart = performance.now();
      sendARDebug('TARGET_MODEL_LOAD_START', { targetName, url: modelCfgUrl });

      if (!modelPromiseCache.has(modelCfgUrl)) {
        modelPromiseCache.set(modelCfgUrl, loadModel(modelCfgUrl, targetName));
      }
      return modelPromiseCache.get(modelCfgUrl);
    }

    // ========== MODEL REPARENTING (instance-aware) ==========
    function reparentModelToAnchor(instance) {
      const model = instance?.model;
      if (!model || !instance.anchor) return;

      // Normalize pivot only once — re-running Box3 on an already-transformed model
      // produces different values on each found/lost cycle
      if (!instance.pivotNormalized) {
        const box = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);

        model.position.set(-center.x, -box.min.y, -center.z);
        model.rotation.set(0, 0, 0);
        model.scale.setScalar(1);

        instance.pivotNormalized = true;
        sendARDebug('MODEL_PIVOT_NORMALIZE', {
          targetName: instance.config.qr_id,
          bboxCenter: [center.x, center.y, center.z],
          pivotCorrection: { x: -center.x, y: -box.min.y, z: -center.z },
        });
      }

      // Apply per-target config to offset group (safe to re-apply — offset is deterministic config)
      const cfg = instance.config;
      if (instance.offsetGroup) {
        const pos = parseVector(cfg?.position, [0, 0, 0]);
        const rot = parseVector(cfg?.rotation, [0, 0, 0]);
        const sc  = parseScale(cfg?.scale);
        instance.offsetGroup.position.set(pos[0], pos[1], pos[2]);
        instance.offsetGroup.rotation.set(rot[0], rot[1], rot[2]);
        instance.offsetGroup.scale.setScalar(sc);
      }

      // Reparent if not already under correct parent
      if (model.parent !== (instance.offsetGroup || instance.anchor)) {
        model.parent?.remove(model);
        (instance.offsetGroup || instance.anchor).add(model);
      }

      cacheCatInteractionProxy(instance);

      sendARDebug('MODEL_REPARENTED', {
        targetName: instance.config.qr_id,
        parentName: (instance.offsetGroup || instance.anchor).name,
        glbLocalPosition: [model.position.x, model.position.y, model.position.z],
      });
    }

    // ========== POSE APPLICATION (instance-aware) ==========
    function applyTargetPose(instance, pose) {
      if (!instance?.anchor || !pose) return;
      instance.anchor.position.set(pose.position.x, pose.position.y, pose.position.z);
      instance.anchor.quaternion.set(pose.rotation.x, pose.rotation.y, pose.rotation.z, pose.rotation.w);
      instance.anchor.scale.setScalar(pose.scale ?? 1);
    }

    // ========== MODEL ATTACHMENT (primary target only in Milestone 1) ==========
    let modelAttached = false;
    let lastAttachAttempt = 0;

    function attemptModelAttach(targetName) {
      if (modelAttached) return;
      if (targetName !== primaryModelTargetName) return;
      if (!loadedModel) return;
      // Skip if already attached at the expected parent with visible=true.
      const target = trackedTargets.get(targetName);
      if (!target) return;

      const now = Date.now();
      if (now - lastAttachAttempt < 500) return;
      lastAttachAttempt = now;

      const instance = targetInstances.get(targetName);
      if (!instance) return;

      if (!scene || !instance.anchor || !instance.offsetGroup) {
        sendARDebug('MODEL_ATTACH_DEFERRED', { targetName, hasScene: !!scene, hasAnchor: !!instance.anchor, hasOffsetGroup: !!instance.offsetGroup });
        return;
      }

      const expectedParent = instance.offsetGroup || instance.anchor;
      if (
        loadedModel.parent === expectedParent &&
        loadedModel.visible &&
        activeTargetName === targetName
      ) {
        // Already attached — refresh pose but skip reparent.
        applyTargetPose(instance, target);
        return;
      }

      if (loadedModel.parent !== expectedParent) {
        reparentModelToAnchor(instance);
      }

      applyTargetPose(instance, target);

      activeTargetName = targetName;
      loadedModel.visible = true;
      modelAttached = true;

      const wp = new THREE.Vector3();
      loadedModel.getWorldPosition(wp);
      sendARDebug('MODEL_ATTACHED', {
        targetName,
        visible: true,
        anchorPosition: [instance.anchor.position.x, instance.anchor.position.y, instance.anchor.position.z],
      });
      sendARDebug('MODEL_VISIBLE', { reason: 'anchor_attached', targetName });
    }

    // Periodic pose update for primary model
    function updateModelPose(detail) {
      if (!loadedModel || !modelAttached || activeTargetName !== detail.name) return;
      const instance = targetInstances.get(detail.name);
      if (!instance) return;

      const p = detail.position, r = detail.rotation, s = detail.scale ?? 1;
      if (!p || !r) return;

      applyTargetPose(instance, { position: { x: p.x, y: p.y, z: p.z }, rotation: { x: r.x, y: r.y, z: r.z, w: r.w }, scale: s });

      const now = Date.now();
      if (!updateModelPose._lastLog || now - updateModelPose._lastLog > 2000) {
        updateModelPose._lastLog = now;
        const wp = new THREE.Vector3();
        loadedModel.getWorldPosition(wp);
        sendARDebug('XR_ANCHOR_ALIGNMENT_CHECK', {
          targetName: detail.name,
          anchorLocalPosition: [instance.anchor.position.x, instance.anchor.position.y, instance.anchor.position.z],
          modelWorldPosition: [wp.x, wp.y, wp.z],
        });
      }
    }

    // ========== LOAD TARGET JSON FROM SUPABASE ==========
    async function loadTargetData(targetConfig) {
      const targetQrId = targetConfig.qr_id;
      const configJsonUrl = targetConfig.xr_target_json_url || '';
      const configImageUrl = targetConfig.xr_target_image_url || '';

      sendARDebug('TARGET_LOAD_START', { qrId: targetQrId });

      let jsonUrl = configJsonUrl;
      if (!jsonUrl && configImageUrl) {
        const match = configImageUrl.match(/^(.+)_[^/]+\.png$/);
        if (match) jsonUrl = match[1] + '.json';
      }
      if (!jsonUrl) throw new Error(`No xr_target_json_url for ${targetQrId}`);

      showOverlay('Loading target data...', jsonUrl.split('/').pop());

      const res = await fetch(jsonUrl);
      if (!res.ok) throw new Error(`Failed to fetch target JSON: ${res.status} for ${targetQrId}`);

      const data = await res.json();
      sendARDebug('TARGET_JSON_PARSED', { qrId: targetQrId, name: data.name, rawKeys: Object.keys(data) });

      let resolvedImagePath = configImageUrl || (jsonUrl.substring(0, jsonUrl.lastIndexOf('/') + 1) + (data.imagePath || ''));
      if (!resolvedImagePath.startsWith('http')) resolvedImagePath = jsonUrl.substring(0, jsonUrl.lastIndexOf('/') + 1) + (data.imagePath || '');

      const physicalWidth = data.properties?.physicalWidth || 0.08;
      sendARDebug('TARGET_LOAD_COMPLETE', { qrId: targetQrId, name: data.name, imageUrl: resolvedImagePath, physicalWidth });

      return {
        qrId: targetQrId,
        name: data.name || targetQrId,
        imagePath: resolvedImagePath,
        type: data.type || 'PLANAR',
        properties: data.properties || {},
        metadata: data.metadata || {},
        physicalWidth,
      };
    }

    // ========== 8TH WALL ENGINE ==========
    let xrController = null;
    const trackedTargets = new Map();
    const realityImageUpdated = { _lastLog: 0 };

    function saveTargetPose(detail) {
      if (!detail?.name) return;
      trackedTargets.set(detail.name, {
        name: detail.name,
        position: { x: detail.position?.x ?? 0, y: detail.position?.y ?? 0, z: detail.position?.z ?? 0 },
        rotation: { x: detail.rotation?.x ?? 0, y: detail.rotation?.y ?? 0, z: detail.rotation?.z ?? 0, w: detail.rotation?.w ?? 1 },
        scale: detail.scale ?? 1,
        lastSeenAt: Date.now(),
      });
    }

    function waitForXR8() {
      return new Promise((resolve, reject) => {
        if (window.XR8) { resolve(window.XR8); return; }
        const timeout = setTimeout(() => reject(new Error('XR8 load timeout (>10s)')), 10000);
        window.addEventListener('xrloaded', () => { clearTimeout(timeout); resolve(window.XR8); }, { once: true });
      });
    }

    async function initXR(targetDataList) {
      sendARDebug('XR_INIT_START', { targets: targetDataList.map(t => t.name) });
      showOverlay('Starting XR session...', '');

      let XR8;
      try {
        XR8 = await waitForXR8();
        logToBuffer('info', 'XR_ENGINE_READY', {});
        sendARDebug('XR_ENGINE_READY', { hasXrController: !!XR8.XrController });
      } catch (err) {
        sendARDebug('XR_ENGINE_LOAD_FAILED', { error: String(err) });
        throw err;
      }

      try { await XR8.loadChunk('slam'); sendARDebug('XR_SLAM_LOADED', {}); }
      catch (err) { sendARDebug('XR_SLAM_LOAD_FAILED', { error: String(err) }); throw err; }

      // Lifecycle
      const lifecycleModule = {
        name: 'app-lifecycle',
        onCameraStatusChange: ({ status }) => {
          sendARDebug('XR_CAMERA_STATUS', { status });
          if (status === 'hasVideo') {
            sendARDebug('XR_CAMERA_HAS_VIDEO', {});
            bootState.cameraReady = true;
            sendARDebug('BOOT_CAMERA_READY', {});
            sendMessage('XR_STARTED', { engine: '8th-wall-self-hosted', qrId, word, hasModel: !!modelUrl, hasModelLoaded: !!loadedModel });
            // Don't reveal AR yet — boot gate controls when the experience becomes visible.
            // Camera is live behind the loading overlay.
            maybeRevealAR({ trigger: 'cameraReady' });
          }
          if (status === 'failed') sendARDebug('XR_CAMERA_FAILED', { status });
        },
        onAttach: ({ imageTargets }) => {
          const targetInfo = imageTargets || [];
          sendARDebug('XR_ONATTACH_TARGETS', { count: targetInfo.length, targets: targetInfo.map(t => ({ name: t.name, imagePath: t.image || t.imagePath || '' })) });
        },
      };

      // Scene acquisition
      let xrSceneAcquired = false;
      const xrSceneAcquisitionModule = {
        name: 'xr-scene-acquisition',
        onStart: () => { tryAcquireXRAuthoring(); },
        onUpdate: () => { if (!xrSceneAcquired) tryAcquireXRAuthoring(); },
      };

      function tryAcquireXRAuthoring() {
        if (xrSceneAcquired || !window.XR8) return;
        try {
          const xr = window.XR8.Threejs?.xrScene?.();
          if (!xr || !xr.scene || !xr.camera || !xr.renderer) return;
          scene = xr.scene; camera = xr.camera; renderer = xr.renderer;

          sendARDebug('XR_THREE_SCENE_ACQUIRED', { sceneChildren: scene.children.length, cameraType: camera.constructor.name });

          // Create anchors for ALL target instances
          for (const [name, inst] of targetInstances) {
            inst.anchor = new THREE.Group();
            inst.anchor.name = `target-anchor:${name}`;
            inst.offsetGroup = new THREE.Group();
            inst.offsetGroup.name = `model-offset:${name}`;
            inst.anchor.add(inst.offsetGroup);
            scene.add(inst.anchor);
            sendARDebug('TARGET_ANCHOR_CREATED', { targetName: name, anchorName: inst.anchor.name });
          }

          // Reference primary target's anchor/mixer for backward compat
          const primaryInst = targetInstances.get(primaryModelTargetName);
          if (primaryInst) {
            targetAnchor = primaryInst.anchor;
            modelOffsetGroup = primaryInst.offsetGroup;
          }

          // Lighting (once, shared scene)
          const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
          hemi.name = 'hemi-light';
          scene.add(hemi);
          const key = new THREE.DirectionalLight(0xffffff, 2.5);
          key.name = 'key-light'; key.position.set(1, 2, 2); scene.add(key);
          const fill = new THREE.DirectionalLight(0xffffff, 0.8);
          fill.name = 'fill-light'; fill.position.set(-2, 0, -1); scene.add(fill);
          sendARDebug('SCENE_LIGHTS_ADDED', { sceneChildren: scene.children.length, lightCount: scene.children.filter(c => c.isLight).length });

          // If primary model already loaded, parent it
          if (loadedModel && primaryInst) {
            reparentModelToAnchor(primaryInst);
            modelWaitingForXRScene = false;
            sendARDebug('MODEL_XR_SCENE_READY', { targetName: primaryModelTargetName });
            if (trackedTargets.size > 0 && !modelAttached) {
              attemptModelAttach(Array.from(trackedTargets.keys())[0]);
            }
          }

          xrSceneAcquired = true;
        } catch (e) {}
      }

      // Camera pipeline
      let renderCheckFrame = 0;
      let lastInteractionEvalMs = 0;
      const cameraPipelineModule = {
        name: 'camera-pipeline',
        onStart: ({ canvas: c }) => { updateDebug('Camera active'); sendARDebug('CAMERA_START', { canvasWidth: c?.width, canvasHeight: c?.height }); },
        onUpdate: () => {
          renderCheckFrame++;
          // Update all active mixers
          for (const [name, inst] of targetInstances) {
            if (inst.mixer) inst.mixer.update(0.016);
          }
          const now = performance.now();
          if (now - lastInteractionEvalMs >= 100) {
            lastInteractionEvalMs = now;
            processPendingTargetLosses(now);
            evaluateInteraction(now);
            updateCatAmbient(now);
          }
          if (renderCheckFrame % 60 === 0) {
            const primaryInst = targetInstances.get(primaryModelTargetName);
            sendARDebug('SCENE_RENDER_CHECK', {
              frame: renderCheckFrame,
              sceneChildren: scene?.children?.length || 0,
              primaryModelVisible: loadedModel?.visible || false,
              targetInstanceCount: targetInstances.size,
              interactionPhase: interactionState.phase,
            });
          }
        },
      };

      // Image target events
      const imageTargetEvents = {
        name: 'image-target-events',
        listeners: [
          { event: 'reality.imageloading', process: ({detail}) => { sendARDebug('IMAGE_LOADING', { name: detail?.name }); } },
          { event: 'reality.imagescanning', process: ({detail}) => { sendARDebug('IMAGE_SCANNING', { name: detail?.name }); } },
          { event: 'reality.imagefound', process: ({detail}) => { sendARDebug('IMAGE_FOUND', { name: detail?.name, position: detail?.position }); if (detail?.name) onTargetFound(detail); } },
          { event: 'reality.imageupdated', process: ({detail}) => {
            if (!detail?.name) return;
            saveTargetPose(detail);

            const instance = targetInstances.get(detail.name);
            const pose = trackedTargets.get(detail.name);
            if (instance && instance.anchor && pose) {
              // Do NOT overwrite primary anchor while combo is latched —
              // the latched pose is frozen so CAT stays visually stable.
              const latchActive = interactionState.comboLatch != null
                && interactionState.comboLatch.runId === interactionState.comboRunId;
              if (!latchActive || detail.name !== interactionState.comboLatch.actorTarget) {
                applyTargetPose(instance, pose);
              }
            }

            const now = Date.now();
            if (!realityImageUpdated._lastLog || now - realityImageUpdated._lastLog > 2000) {
              realityImageUpdated._lastLog = now;
              sendARDebug('IMAGE_UPDATED', { name: detail?.name });
            }
          }},
          { event: 'reality.imagelost', process: ({detail}) => { sendARDebug('IMAGE_LOST', { name: detail?.name }); if (detail?.name) onTargetLost(detail.name); } },
        ],
      };

      // Register pipeline modules
      XR8.addCameraPipelineModule(lifecycleModule);
      XR8.addCameraPipelineModule(XR8.GlTextureRenderer.pipelineModule());
      XR8.addCameraPipelineModule(XR8.Threejs.pipelineModule());
      XR8.addCameraPipelineModule(xrSceneAcquisitionModule);
      XR8.addCameraPipelineModule(imageTargetEvents);
      XR8.addCameraPipelineModule(XR8.XrController.pipelineModule());
      XR8.addCameraPipelineModule(cameraPipelineModule);

      sendARDebug('XR_PIPELINE_READY', {});

      // Configure ALL image targets — disableWorldTracking reduces processing for
      // image-target-only experiences (no surface/plane SLAM needed)
      const imageTargetData = targetDataList.map(t => ({ name: t.name, type: t.type || 'PLANAR', imagePath: t.imagePath, properties: t.properties || {}, metadata: t.metadata || {} }));
      sendARDebug('XR_TARGETS_REGISTER', { count: imageTargetData.length, targets: imageTargetData.map(t => t.name) });
      XR8.XrController.configure({ disableWorldTracking: true, imageTargetData });
      sendARDebug('XR_TARGETS_CONFIGURED', { count: imageTargetData.length });

      const canvasEl = document.getElementById('camerafeed');
      if (!canvasEl) throw new Error('Canvas #camerafeed not found');
      canvasEl.width = window.innerWidth; canvasEl.height = window.innerHeight;

      RuntimeDiagnostics.xrRunCount++;
      RuntimeDiagnostics.assert(RuntimeDiagnostics.xrRunCount === 1, `XR8.run() called ${RuntimeDiagnostics.xrRunCount} times`);
      sendARDebug('XR_RUN_CALLED', {});
      try { XR8.run({ canvas: canvasEl }); }
      catch (err) { sendARDebug('XR_RUN_ERROR', { message: String(err) }); throw err; }
      sendARDebug('XR_SESSION_STARTED', {});
    }

    // ========== INTERACTION HELPERS ==========
    function setInteractionPhase(nextPhase, extras = {}) {
      if (interactionState.phase === nextPhase) return;
      const previous = interactionState.phase;
      interactionState.phase = nextPhase;
      sendARDebug('INTERACTION_PHASE', { from: previous, to: nextPhase, ...extras });
    }

    function getAnchorWorldPosition(instance) {
      // Use target anchor pose (not model transform) — pose is what represents
      // the actual flashcard position in world space, free of pivot/scale/offset.
      const pose = trackedTargets.get(instance.config.qr_id);
      if (!pose) return null;
      return { x: pose.position.x, y: pose.position.y, z: pose.position.z };
    }

    function computeTargetPairDistance(actorInst, partnerInst) {
      return distanceBetweenPositions(
        getAnchorWorldPosition(actorInst),
        getAnchorWorldPosition(partnerInst),
      );
    }

    function updateFilteredDistance(raw, proximityConfig) {
      if (raw == null) {
        interactionState.filteredDistance = null;
        return null;
      }
      const a = proximityConfig?.smoothingAlpha ?? INTERACTION_CONFIG.distance.smoothingAlpha;
      interactionState.filteredDistance =
        interactionState.filteredDistance == null
          ? raw
          : interactionState.filteredDistance * (1 - a) + raw * a;
      return interactionState.filteredDistance;
    }

    function getInteractionRuleById(ruleId) {
      return normalizedInteractionRules.find((rule) => rule.id === ruleId) || null;
    }

    function getEffectivelyTrackedTargetNames(now) {
      const names = [];
      for (const [targetName, instance] of targetInstances) {
        const withinGrace = instance.lostAt != null
          && (now - instance.lostAt) < INTERACTION_CONFIG.lostGraceMs;
        if (instance.tracked || withinGrace) names.push(targetName);
      }
      return names;
    }

    function isInteractionExecutionLocked() {
      return interactionState.actorReturn != null
        || interactionState.phase === InteractionPhase.COMBO_ARMED
        || interactionState.phase === InteractionPhase.COMBO_TURNING
        || interactionState.phase === InteractionPhase.COMBO_PLAYING;
    }

    function clearConsumeTimer() {
      if (interactionState.consumeTimeoutId == null) return;
      clearTimeout(interactionState.consumeTimeoutId);
      interactionState.consumeTimeoutId = null;
    }

    function clearInteractionExecutionState() {
      const latch = interactionState.comboLatch;
      const actorInst = latch ? targetInstances.get(latch.actorTarget) : null;
      const root = actorInst ? getInteractionRoot(actorInst) : null;
      if (root && Number.isFinite(latch?.actorOriginalYaw)) root.rotation.y = latch.actorOriginalYaw;
      interactionState.comboRunId++;
      clearConsumeTimer();
      interactionState.primaryLockedAt = null;
      interactionState.proximityEnteredAt = null;
      interactionState.filteredDistance = null;
      interactionState.comboPlaying = false;
      interactionState.comboConsumed = false;
      interactionState.comboLatch = null;
      interactionState.actorTurn = null;
      interactionState.actorReturn = null;
      interactionState.lastSecondaryReadiness = null;
    }

    function changeSelectedInteractionRule(nextRule, reason) {
      const previousRule = getInteractionRuleById(selectedInteractionRuleId);
      if ((previousRule?.id || null) === (nextRule?.id || null)) return;
      if (previousRule && interactionState.comboConsumed) {
        setInteractionPartnerVisibility({ rule: previousRule, targetInstances, visible: true });
      }
      clearInteractionExecutionState();
      if (previousRule) sendARDebug('INTERACTION_RULE_CLEARED', { ruleId: previousRule.id, reason });

      selectedInteractionRuleId = nextRule?.id || null;
      interactionState.actorTarget = nextRule?.actorTarget || null;
      interactionState.partnerTargets = nextRule ? [...nextRule.partnerTargets] : [];
      setInteractionPhase(InteractionPhase.SEARCH_PRIMARY, { reason });
      if (nextRule) {
        sendARDebug('INTERACTION_RULE_SELECTED', {
          ruleId: nextRule.id,
          actorTarget: nextRule.actorTarget,
          partnerTargets: nextRule.partnerTargets,
          priority: nextRule.priority,
        });
      }
    }

    function selectRuntimeInteractionRule(now) {
      if (isInteractionExecutionLocked() && interactionState.comboLatch) {
        return getInteractionRuleById(interactionState.comboLatch.ruleId);
      }
      const availableRules = normalizedInteractionRules.filter(
        (rule) => !unavailableAnimationRuleIds.has(rule.id),
      );
      const nextRule = selectActiveInteractionRule(
        availableRules,
        getEffectivelyTrackedTargetNames(now),
      );
      changeSelectedInteractionRule(nextRule, nextRule ? 'rule_match_changed' : 'no_matching_rule');
      return nextRule;
    }

    function scheduleInteractionPartnerConsume(runId, clipDurationMs, activeRule) {
      clearConsumeTimer();
      if (!activeRule.action.consumePartners) return;
      const delayMs = Math.round(clipDurationMs * activeRule.action.consumeAtRatio);
      sendARDebug('SECONDARY_CONSUME_SCHEDULED', {
        runId,
        ruleId: activeRule.id,
        delayMs,
        ratio: activeRule.action.consumeAtRatio,
      });
      interactionState.consumeTimeoutId = setTimeout(() => {
        interactionState.consumeTimeoutId = null;
        if (
          runId !== interactionState.comboRunId
          || interactionState.phase !== InteractionPhase.COMBO_PLAYING
        ) {
          sendARDebug('SECONDARY_CONSUME_IGNORED_STALE', { runId, currentRunId: interactionState.comboRunId });
          return;
        }
        const latch = interactionState.comboLatch;
        if (!latch || latch.ruleId !== activeRule.id) return;
        const changedTargets = setInteractionPartnerVisibility({
          rule: { partnerTargets: latch.partnerTargets },
          targetInstances,
          visible: false,
        });
        for (const targetName of changedTargets) {
          sendARDebug('SECONDARY_CONSUMED', { runId, ruleId: latch.ruleId, targetName });
        }
      }, delayMs);
    }

    function resetInteractionSession(reason, { restorePartners = true } = {}) {
      const prevPhase = interactionState.phase;
      const prevRunId = interactionState.comboRunId;
      const activeRule = getInteractionRuleById(
        interactionState.comboLatch?.ruleId || selectedInteractionRuleId,
      );
      if (restorePartners && activeRule) {
        setInteractionPartnerVisibility({ rule: activeRule, targetInstances, visible: true });
      }
      clearInteractionExecutionState();
      if (selectedInteractionRuleId) {
        sendARDebug('INTERACTION_RULE_CLEARED', { ruleId: selectedInteractionRuleId, reason });
      }
      selectedInteractionRuleId = null;
      interactionState.actorTarget = null;
      interactionState.partnerTargets = [];
      sendARDebug('INTERACTION_SESSION_RESET', {
        reason,
        previousPhase: prevPhase,
        previousRunId: prevRunId,
        newRunId: interactionState.comboRunId,
      });

      setInteractionPhase(InteractionPhase.SEARCH_PRIMARY, { reason });
    }

    // Get or create the interaction-root group for the primary model.
    // This sits between model-offset and the GLB, allowing procedural transforms
    // (body rotation) that do not disturb anchor tracking or DB position/rotation/scale.
    function getInteractionRoot(instance) {
      if (!instance?.model) return null;
      const model = instance.model;
      // Find if interaction-root already exists (child of offsetGroup, parent of GLB)
      const offsetGroup = instance.offsetGroup;
      if (!offsetGroup) return null;
      for (const child of offsetGroup.children) {
        if (child.name === 'interaction-root:' + instance.config.qr_id) return child;
      }
      // Create it
      const root = new THREE.Group();
      root.name = 'interaction-root:' + instance.config.qr_id;
      // Reparent GLB under interaction-root
      offsetGroup.add(root);
      root.add(model);
      sendARDebug('INTERACTION_ROOT_CREATED', { targetName: instance.config.qr_id });
      return root;
    }

    // Calculate yaw angle (radians) required to rotate from 'from' Vector3 to 'to' Vector3,
    // in the XZ plane (horizontal), using +Z as forward.
    function yawFromForward(fromPos, toPos) {
      const dx = toPos.x - fromPos.x;
      const dz = toPos.z - fromPos.z;
      return Math.atan2(dx, dz);
    }

    function getDefaultAnimationClip(instance) {
      const defaultName = instance?.config?.default_animation;
      return defaultName
        ? instance.animations?.find((clip) => clip.name === defaultName) || null
        : null;
    }

    // Tween the selected actor body yaw each frame during COMBO_TURNING.
    // Called inline from evaluateInteraction each frame.
    function updateActorTurn(now) {
      const turn = interactionState.actorTurn;
      if (!turn) return;

      // Check stale
      if (turn.runId !== interactionState.comboRunId) {
        interactionState.actorTurn = null;
        return;
      }

      const elapsed = now - turn.startedAt;
      const t = smoothstep(Math.min(elapsed / turn.durationMs, 1));
      const currentYaw = turn.fromYaw + (turn.toYaw - turn.fromYaw) * t;

      const actorInst = targetInstances.get(turn.actorTarget);
      const root = actorInst ? getInteractionRoot(actorInst) : null;
      if (root) {
        root.rotation.y = currentYaw;
      }

      if (elapsed >= turn.durationMs) {
        // Turn complete — snap to final and clear
        if (root) root.rotation.y = turn.toYaw;
        interactionState.actorTurn = null;
        sendARDebug('INTERACTION_ACTOR_TURN_COMPLETE', {
          runId: turn.runId,
          actorTarget: turn.actorTarget,
          finalYawDeg: (turn.toYaw * 180 / Math.PI).toFixed(1),
        });
        if (isCatMascotInstance(actorInst)) {
          sendARDebug('CAT_TURN_COMPLETE', {
            runId: turn.runId,
            finalYawDeg: (turn.toYaw * 180 / Math.PI).toFixed(1),
          });
        }
        // Set COMBO_PLAYING before triggering the rule animation; otherwise the
        // finish callback sees phase===COMBO_TURNING and treats the finish as stale.
        setInteractionPhase(InteractionPhase.COMBO_PLAYING);
        triggerInteractionAnimation(actorInst, getInteractionRuleById(turn.ruleId), turn.runId);
      }
    }

    // Trigger the selected rule animation using the actor's existing mixer.
    function triggerInteractionAnimation(actorInst, activeRule, runId) {
      const resolution = resolveInteractionAnimation({ rule: activeRule, actorInstance: actorInst });
      if (!actorInst?.mixer || !resolution.ok) {
        sendARDebug('INTERACTION_ANIMATION_MISSING', {
          ruleId: activeRule?.id || null,
          actorTarget: activeRule?.actorTarget || null,
          requested: resolution.requested,
          available: resolution.available,
          reason: actorInst?.mixer ? 'clip_missing' : 'mixer_missing',
        });
        if (activeRule?.id) unavailableAnimationRuleIds.add(activeRule.id);
        resetInteractionSession('animation_missing', { restorePartners: false });
        return false;
      }
      const clip = resolution.clip;
      const mixer = actorInst.mixer;
      const catActor = isCatMascotInstance(actorInst);
      const idleClip = catActor ? getCatIdleClip(actorInst) : getDefaultAnimationClip(actorInst);
      if (idleClip) {
        mixer.clipAction(idleClip).fadeOut(0.15);
      }
      const action = mixer.clipAction(clip);
      let animationGeneration = null;
      if (catActor) {
        catAnimationState.generation++;
        animationGeneration = catAnimationState.generation;
        catAnimationState.action = action;
        catAnimationState.clipName = clip.name;
        catAnimationState.source = activeRule.animation;
        catAnimationState.priority = 100;
      }
      action.reset();
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.fadeIn(0.15);
      action.play();
      sendARDebug('INTERACTION_ANIMATION_START', {
        ruleId: activeRule.id,
        actorTarget: activeRule.actorTarget,
        clip: clip.name,
        runId,
      });
      sendARDebug('COMBO_ANIMATION_START', {
        targetName: activeRule.actorTarget,
        clip: clip.name,
        durationMs: Math.round((clip.duration || 0) * 1000),
      });
      scheduleInteractionPartnerConsume(runId, (clip.duration || 0) * 1000, activeRule);
      const onFinish = (e) => {
        if (e.action !== action) return;
        mixer.removeEventListener('finished', onFinish);
        const catOwnershipValid = !catActor || isCatOneShotCompletionOwner({
          capturedGeneration: animationGeneration,
          capturedAction: action,
          current: catAnimationState,
        });
        if (
          runId !== interactionState.comboRunId ||
          interactionState.phase !== InteractionPhase.COMBO_PLAYING ||
          !catOwnershipValid
        ) {
          sendARDebug('COMBO_FINISH_IGNORED_STALE', {
            runId,
            currentRunId: interactionState.comboRunId,
            phase: interactionState.phase,
          });
          return;
        }
        if (catActor) {
          const idleAction = idleClip ? mixer.clipAction(idleClip) : null;
          sendARDebug('CAT_ACTION_STATE_AFTER_EAT', {
            eatRunning: action.isRunning(),
            eatWeight: action.getEffectiveWeight(),
            eatTime: action.time,
            eatClampWhenFinished: action.clampWhenFinished,
