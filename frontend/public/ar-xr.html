<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall AR - Claymorphic Flashcards</title>

  <!-- Eruda Debug Console -->
  <script>
    var xrDebugParams = new URLSearchParams(location.search);
    if (xrDebugParams.get('eruda') === 'true' || location.hostname === 'localhost') {
      (function() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda@3';
        s.onload = function() { eruda.init({
          defaults: { displaySize: 30, transparency: 0.8 },
          useShadowDom: true
        }); };
        document.head.appendChild(s);
      })();
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9); color: #fff;
      z-index: 100; transition: opacity 0.3s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #4ecdc4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text { font-size: 18px; margin-bottom: 8px; text-align: center; }
    #hint-text { font-size: 14px; opacity: 0.6; text-align: center; }
    #error-text { color: #FF6B6B; font-size: 14px; margin-top: 16px; text-align: center; max-width: 280px; }

    #card-label {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 8px 20px; border-radius: 20px;
      font-size: 18px; font-weight: 600;
      z-index: 50; pointer-events: none;
      opacity: 0; transition: opacity 0.3s ease;
    }
    #card-label.visible { opacity: 1; }

    #debug-panel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #0f0;
      padding: 8px 12px; border-radius: 8px; font-size: 11px;
      font-family: monospace; z-index: 200;
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"><canvas id="canvas"></canvas></div>

  <div id="overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading 8th Wall Engine...</div>
    <div id="hint-text">Point camera at flashcard</div>
    <div id="error-text"></div>
  </div>

  <div id="card-label"></div>

  <div id="debug-panel">
    <div id="debug-status">Initializing...</div>
    <div id="debug-engine">Engine: 8th Wall (self-hosted)</div>
  </div>

  <!-- Self-hosted 8th Wall Engine (no AppKey needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js"></script>

  <!-- Three.js importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ========== PARAMS FROM URL ==========
    const params = new URLSearchParams(location.search);
    const qrId           = params.get('qr_id') || '';
    const modelUrl       = params.get('model_3d_url') || '';
    const targetJsonUrl   = params.get('xr_target_json_url') || '';
    const targetImageUrl  = params.get('xr_target_image_url') || '';
    const word            = params.get('word') || qrId;
    const isDebug         = location.hostname === 'localhost' || params.get('debug') === 'true';

    // DOM
    const overlay     = document.getElementById('overlay');
    const loadingText  = document.getElementById('loading-text');
    const hintText     = document.getElementById('hint-text');
    const errorText    = document.getElementById('error-text');
    const cardLabel    = document.getElementById('card-label');
    const debugPanel   = document.getElementById('debug-panel');
    const debugStatus  = document.getElementById('debug-status');
    const canvas       = document.getElementById('canvas');

    if (isDebug) debugPanel.style.display = 'block';

    // ========== POST MESSAGE ==========
    function sendMessage(type, payload = {}) {
      window.parent.postMessage({ type, payload, timestamp: Date.now() }, '*');
      console.log('[ar-xr] SEND:', type, payload);
    }

    function showOverlay(text, hint = '') {
      overlay.classList.remove('hidden');
      loadingText.textContent = text;
      hintText.textContent   = hint;
      errorText.textContent  = '';
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function showError(msg) {
      errorText.textContent = msg;
      console.error('[ar-xr] Error:', msg);
    }

    function updateDebug(text) {
      debugStatus.textContent = text;
    }

    function showCardLabel(name) {
      cardLabel.textContent = name;
      cardLabel.classList.add('visible');
      setTimeout(() => cardLabel.classList.remove('visible'), 3000);
    }

    // ========== THREE.JS SCENE ==========
    let scene, camera, renderer, loadedModel = null, mixer = null;
    let modelPos = [0, 0, -0.5];
    let modelRot = [0, 0, 0];
    let modelScale = 1;

    function initThree() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping      = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.xr.enabled = true;

      // Lighting for claymorphic look
      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.5);
      key.position.set(0, 3, 5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.4);
      fill.position.set(-3, 0, -2);
      scene.add(fill);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ========== MODEL LOADING ==========
    function loadModel(url) {
      return new Promise((resolve, reject) => {
        const loader = new GLTFLoader();
        loader.load(url,
          (gltf) => {
            const model = gltf.scene;
            model.visible = false;

            // Claymorphic material
            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow    = true;
                child.receiveShadow = true;
              }
            });

            // Apply position/rotation/scale from URL params
            const pos = params.get('position')?.split(' ').map(Number) || [0, 0, -0.5];
            const rot = params.get('rotation')?.split(' ').map(Number) || [0, 0, 0];
            const sc  = parseFloat(params.get('scale') || '1');
            model.position.set(pos[0], pos[1], pos[2]);
            model.rotation.set(rot[0], rot[1], rot[2]);
            model.scale.setScalar(sc);

            modelPos   = pos;
            modelRot   = rot;
            modelScale = sc;

            scene.add(model);
            loadedModel = model;

            // Animations
            if (gltf.animations?.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              const defaultClip = gltf.animations.find(a =>
                a.name.toUpperCase().includes('IDLE')
              ) || gltf.animations[0];
              mixer.clipAction(defaultClip).play();
              console.log('[ar-xr] Animations:', gltf.animations.map(a => a.name));
            }

            console.log('[ar-xr] Model loaded:', url);
            resolve(model);
          },
          (progress) => {
            if (progress.total) {
              updateDebug(`Model ${Math.round(progress.loaded / progress.total * 100)}%`);
            }
          },
          (error) => {
            console.error('[ar-xr] Model load error:', error);
            reject(error);
          }
        );
      });
    }

    // ========== LOAD TARGET JSON FROM SUPABASE ==========
    async function loadTargetData() {
      // Prefer explicit target JSON URL, else build from base
      let jsonUrl = targetJsonUrl;
      if (!jsonUrl && targetImageUrl) {
        // Build JSON URL from image URL path pattern:
        // image_url: .../cat001_luminance.png
        // json_url:  .../cat001.json
        const match = targetImageUrl.match(/^(.+)_[^/]+\.png$/);
        if (match) jsonUrl = match[1] + '.json';
      }

      if (!jsonUrl) {
        throw new Error('No xr_target_json_url or xr_target_image_url provided');
      }

      showOverlay('Loading target data...', jsonUrl.split('/').pop());
      updateDebug('Fetching: ' + jsonUrl.split('/').pop());

      const res = await fetch(jsonUrl);
      if (!res.ok) throw new Error(`Failed to fetch target JSON: ${res.status}`);

      const data = await res.json();

      // Build absolute image URL from relative imagePath in JSON
      const baseUrl = jsonUrl.substring(0, jsonUrl.lastIndexOf('/') + 1);
      const relPath = data.imagePath || '';
      const imageUrl = relPath.startsWith('http')
        ? relPath
        : baseUrl + relPath;

      // physicalWidth in meters (default 8cm — standard flashcard width)
      const physicalWidth = data.properties?.physicalWidth || 0.08;

      console.log('[ar-xr] Target:', data.name, '| Image:', imageUrl, '| Width:', physicalWidth + 'm');

      return {
        name: data.name || qrId,
        image: imageUrl,
        physicalWidth,
      };
    }

    // ========== 8TH WALL ENGINE (SELF-HOSTED, NO APPKEY) ==========
    let xrController = null;
    const trackedTargets = new Set();

    async function initXR(targetData) {
      showOverlay('Starting XR session...', '');

      // Wait for XR8 to be ready
      const checkLoaded = () => new Promise(resolve => {
        if (XR8.isLoaded()) { resolve(true); return; }
        window.addEventListener('xrloaded', resolve, { once: true });
        // Timeout fallback after 8s
        setTimeout(resolve, 8000);
      });

      await checkLoaded();

      if (typeof XR8 === 'undefined') {
        throw new Error('8th Wall engine failed to load. Check CDN connectivity.');
      }

      if (!XR8.isLoaded()) {
        throw new Error('8th Wall SDK did not load. Try refreshing.');
      }

      updateDebug('8th Wall ready');

      // Configure image targets
      XR8.XrController.configure({
        imageTargetData: [{
          image: targetData.image,
          name: targetData.name,
          physicalWidth: targetData.physicalWidth,
        }],
      });

      // Camera pipeline — handles frame loop and target tracking
      const cameraPipelineModule = {
        name: 'camera-pipeline',
        onStart: ({ canvas: c, gl }) => {
          console.log('[ar-xr] Camera pipeline started');
          updateDebug('Camera active');
          hideOverlay();

          sendMessage('AR_READY', {
            engine: '8th-wall-self-hosted',
            qrId: qrId,
            word: word,
            hasModel: !!modelUrl,
          });
        },
        onUpdate: (frame) => {
          // Animate model if mixer exists
          if (mixer) mixer.update(0.016);

          // Idle float
          if (loadedModel && loadedModel.visible) {
            loadedModel.position.y = (modelPos[1] || 0) + Math.sin(Date.now() * 0.001) * 0.005;
          }
        },
      };

      // Custom render pipeline — draw Three.js scene
      const renderModule = {
        name: 'custom-render',
        onStart: () => {
          console.log('[ar-xr] Render module started');
        },
        onUpdate: () => {
          if (renderer && scene && camera) {
            renderer.render(scene, camera);
          }
        },
      };

      // Start XR session
      await XR8.addCameraPipelineModule(cameraPipelineModule);
      await XR8.addCameraPipelineModule(renderModule);
      await XR8.startSession({ requestedFeatures: ['image-targets'] });

      console.log('[ar-xr] XR session started');
      updateDebug('Tracking active');

      // Watch for target found/lost via frame data
      watchTargets();

    } // initXR

    // Poll tracked targets each animation frame
    let animationFrameId = null;
    function watchTargets() {
      function check() {
        if (!XR8.XrController) { animationFrameId = requestAnimationFrame(check); return; }
        const reality = XR8.XrController.reality();
        if (reality && reality.cameraPixelsTracked) {
          const targetName = qrId || word;
          const tracked = reality.cameraPixelsTracked(targetName);
          if (tracked && !trackedTargets.has(targetName)) {
            trackedTargets.add(targetName);
            onTargetFound(targetName);
          } else if (!tracked && trackedTargets.has(targetName)) {
            trackedTargets.delete(targetName);
            onTargetLost(targetName);
          }
        }
        animationFrameId = requestAnimationFrame(check);
      }
      check();
    }

    function onTargetFound(name) {
      console.log('[ar-xr] Target found:', name);
      sendMessage('TARGET_FOUND', { targetIndex: 0, qrId: name, word: word });
      showCardLabel(word);
      if (loadedModel) loadedModel.visible = true;
    }

    function onTargetLost(name) {
      console.log('[ar-xr] Target lost:', name);
      sendMessage('TARGET_LOST', { targetIndex: 0, qrId: name });
      if (loadedModel) loadedModel.visible = false;
    }

    // ========== COMBO DETECTION (from backend) ==========
    let comboRules = [];

    async function loadComboRules() {
      try {
        const deck = params.get('deck_id') || 'claymorphic-animals-001';
        const res = await fetch(
          `https://edu-platform-api-do20.onrender.com/api/v1/combinations/rules?flashcard_set=${encodeURIComponent(deck)}`
        );
        if (res.ok) {
          const data = await res.json();
          comboRules = data.rules || data || [];
          console.log('[ar-xr] Combo rules loaded:', comboRules.length);
        }
      } catch (e) {
        console.warn('[ar-xr] Combo rules unavailable:', e);
      }
    }

    // ========== MESSAGE LISTENER ==========
    window.addEventListener('message', (event) => {
      const { type, payload } = event.data || {};
      if (!type) return;
      console.log('[ar-xr] RECV:', type, payload);

      if (type === 'DEBUG_TOGGLE') {
        debugPanel.style.display = payload?.enabled ? 'block' : 'none';
      }
    });

    // ========== MAIN ==========
    async function main() {
      console.log('[ar-xr] Initializing 8th Wall (self-hosted)');
      console.log('[ar-xr] Params:', { qrId, modelUrl, targetJsonUrl, targetImageUrl, word, isDebug });

      initThree();
      updateDebug('Three.js ready');

      // Load combo rules in background
      loadComboRules();

      // Load model and target data in parallel
      const targetData = await loadTargetData();
      const modelPromise = modelUrl ? loadModel(modelUrl) : Promise.resolve(null);

      await initXR(targetData);

      // Also wait for model
      await modelPromise;

      console.log('[ar-xr] Initialization complete');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main);
    } else {
      main();
    }
  </script>
</body>
</html>
