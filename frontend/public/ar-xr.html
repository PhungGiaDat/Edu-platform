<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall AR - Claymorphic Flashcards</title>

  <!-- Forward engine logs before MindAR module begins loading. -->
  <script>
    (function installXrDebugBridge() {
      var params = new URLSearchParams(location.search);
      if (params.get('debug') !== 'true' && location.hostname !== 'localhost') return;

      function sendDebug(label, details) {
        window.parent.postMessage({
          type: 'AR_DEBUG',
          payload: { label: label, details: details || {}, source: 'ar-xr-console' },
          timestamp: Date.now(),
          origin: 'child'
        }, '*');
      }

      function serialise(args) {
        return Array.prototype.slice.call(args).map(function(value) {
          try {
            if (value instanceof Error) return value.stack || value.message;
            return typeof value === 'object' ? JSON.stringify(value) : String(value);
          } catch (_) {
            return String(value);
          }
        }).join(' ').slice(0, 4000);
      }

      ['error', 'warn', 'log', 'info'].forEach(function(level) {
        var original = console[level].bind(console);
        console[level] = function() {
          try {
            sendDebug('XR_CONSOLE_' + level.toUpperCase(), {
              level: level,
              text: serialise(arguments),
              engine: 'mindar-local'
            });
          } catch (_) { /* debug must never stop XR */ }
          return original.apply(console, arguments);
        };
      });

      window.addEventListener('error', function(event) {
        sendDebug('XR_UNCAUGHT_ERROR', {
          level: 'error',
          text: String(event.message || event.error || 'Unknown XR error'),
          engine: 'mindar-local'
        });
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        sendDebug('XR_UNHANDLED_REJECTION', {
          level: 'error',
          text: event.reason instanceof Error
            ? (event.reason.stack || event.reason.message)
            : String(event.reason),
          engine: 'mindar-local'
        });
      });

      console.info('[ar-xr] Debug bridge installed before engine bootstrap');
    })();
  </script>

  <!-- Eruda Debug Console -->
  <script>
    var xrDebugParams = new URLSearchParams(location.search);
    if (xrDebugParams.get('eruda') === 'true' || location.hostname === 'localhost') {
      (function() {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda@3';
        s.onload = function() { eruda.init({
          defaults: { displaySize: 30, transparency: 0.8 },
          useShadowDom: true
        }); };
        document.head.appendChild(s);
      })();
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Loading overlay */
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9); color: #fff;
      z-index: 100; transition: opacity 0.3s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #4ecdc4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text { font-size: 18px; margin-bottom: 8px; text-align: center; }
    #hint-text { font-size: 14px; opacity: 0.6; text-align: center; }
    #error-text { color: #FF6B6B; font-size: 14px; margin-top: 16px; text-align: center; max-width: 280px; }

    /* Card name label on screen */
    #card-label {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 8px 20px; border-radius: 20px;
      font-size: 18px; font-weight: 600;
      z-index: 50; pointer-events: none;
      opacity: 0; transition: opacity 0.3s ease;
    }
    #card-label.visible { opacity: 1; }

    /* Debug panel */
    #debug-panel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #0f0;
      padding: 8px 12px; border-radius: 8px; font-size: 11px;
      font-family: monospace; z-index: 200;
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading AR Engine...</div>
    <div id="hint-text">Point camera at flashcard</div>
    <div id="error-text"></div>
  </div>

  <div id="card-label"></div>

  <div id="debug-panel">
    <div id="debug-status">Initializing...</div>
    <div id="debug-engine">Engine: MindAR-Local</div>
  </div>

  <!-- MindAR JS (local, no AppKey needed) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/src/image-target/mindar-imageprod.js"></script>
  <!-- A-Frame + Three.js (MindAR dependency) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- GLTFLoader for .glb models -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
  (function() {
    'use strict';

    // ========== PARAMS FROM URL ==========
    var params = new URLSearchParams(window.location.search);
    var qrId       = params.get('qr_id') || '';
    var modelUrl   = params.get('model_3d_url') || '';
    var mindFile   = params.get('mind_file_url') || '';
    var targetImg  = params.get('xr_target_image_url') || params.get('reference_image_url') || '';
    var word       = params.get('word') || qrId;
    var position   = params.get('position') || '0 0 -0.5';
    var rotation   = params.get('rotation') || '0 0 0';
    var scale      = parseFloat(params.get('scale') || '1');
    var isDebug    = window.location.hostname === 'localhost' || params.get('debug') === 'true';

    // DOM
    var overlay      = document.getElementById('overlay');
    var loadingText   = document.getElementById('loading-text');
    var hintText      = document.getElementById('hint-text');
    var errorText     = document.getElementById('error-text');
    var cardLabel     = document.getElementById('card-label');
    var debugPanel    = document.getElementById('debug-panel');
    var debugStatus   = document.getElementById('debug-status');
    var canvas        = document.getElementById('canvas');

    if (isDebug) {
      debugPanel.style.display = 'block';
    }

    // ========== POST MESSAGE ==========
    function sendMessage(type, payload) {
      payload = payload || {};
      window.parent.postMessage({ type: type, payload: payload, timestamp: Date.now() }, '*');
      console.log('[ar-xr] SEND:', type, payload);
    }

    function showOverlay(text, hint) {
      overlay.classList.remove('hidden');
      loadingText.textContent = text || 'Loading...';
      hintText.textContent   = hint  || '';
      errorText.textContent  = '';
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function showError(msg) {
      errorText.textContent = msg;
      console.error('[ar-xr] Error:', msg);
    }

    function updateDebug(text) {
      debugStatus.textContent = text;
    }

    function showCardLabel(name) {
      cardLabel.textContent = name;
      cardLabel.classList.add('visible');
      setTimeout(function() { cardLabel.classList.remove('visible'); }, 3000);
    }

    // ========== THREE.JS SCENE ==========
    var scene, camera, renderer, loadedModel, mixer, clock;

    function initThree() {
      scene = new THREE.Scene();
      clock = new THREE.Clock();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping      = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      // Lighting for claymorphic style
      var ambient = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambient);

      var key = new THREE.DirectionalLight(0xffffff, 1.5);
      key.position.set(0, 3, 5);
      scene.add(key);

      var fill = new THREE.DirectionalLight(0xffffff, 0.4);
      fill.position.set(-3, 0, -2);
      scene.add(fill);

      window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ========== MODEL LOADING ==========
    var pendingAnimations = [];

    function loadModel(url) {
      return new Promise(function(resolve, reject) {
        var loader = new THREE.GLTFLoader();
        loader.load(url,
          function(gltf) {
            var model = gltf.scene;
            model.visible = false;

            // Claymorphic look: soft edges + pastel tint
            model.traverse(function(child) {
              if (child.isMesh) {
                child.castShadow    = true;
                child.receiveShadow = true;
                // Mild claymorphic tint if material is basic
                if (child.material && !child.material.map) {
                  child.material = new THREE.MeshStandardMaterial({
                    color: 0xf0e6d3,
                    roughness: 0.7,
                    metalness: 0.0,
                  });
                }
              }
            });

            // Parse position — default Z=-0.5 (in front of camera) so '0 0 0' works
            var pos = position.split(' ').map(Number);
            var rot = rotation.split(' ').map(Number);
            // MindAR camera is at origin, z negative = in front. Default to z=-0.5 if not set.
            model.position.set(pos[0] || 0, pos[1] || 0, (pos[2] !== undefined ? pos[2] : -0.5));
            model.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
            model.scale.setScalar(scale || 1);

            scene.add(model);
            loadedModel = model;

            // Store animations
            if (gltf.animations && gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              pendingAnimations = gltf.animations.map(function(clip) {
                return { name: clip.name, clip: clip };
              });
              console.log('[ar-xr] Animations available:', pendingAnimations.map(function(a) { return a.name; }));

              // Play first animation (IDLE) automatically
              playAnimation(pendingAnimations[0].name);
            }

            console.log('[ar-xr] Model loaded:', url);
            resolve(model);
          },
          function(progress) {
            var pct = progress.total ? Math.round((progress.loaded / progress.total) * 100) : '';
            updateDebug('Loading model ' + pct + '%');
          },
          function(error) {
            console.error('[ar-xr] Model load error:', error);
            reject(error);
          }
        );
      });
    }

    function playAnimation(name) {
      if (!mixer) return;
      var clip = THREE.AnimationClip.findByName(pendingAnimations.map(function(a) { return a.clip; }), name);
      if (clip) {
        var action = mixer.clipAction(clip);
        action.reset().fadeIn(0.3).play();
        console.log('[ar-xr] Play animation:', name);
      }
    }

    // ========== ANIMATION LOOP ==========
    function animate() {
      requestAnimationFrame(animate);
      var delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      // Idle float animation on Y axis
      if (loadedModel && loadedModel.visible) {
        loadedModel.position.y += Math.sin(Date.now() * 0.002) * 0.0003;
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    // ========== MINDAR (LOCAL ENGINE — NO APPKEY) ==========
    var controller = null;

    async function initMindAR() {
      showOverlay('Starting AR engine...', mindFile ? 'Loading MindAR target' : 'Loading image target');

      try {
        if (typeof MindARImage === 'undefined') {
          throw new Error('MindAR not loaded. Check CDN.');
        }

        // Build target — prefer .mind file (more accurate), fallback to image URL
        var targets = [];
        if (mindFile) {
          targets.push({ type: 'mindFile', src: mindFile });
        } else if (targetImg) {
          targets.push({ type: 'imageTarget', src: targetImg });
        } else {
          throw new Error('No mind file or target image URL provided');
        }

        var compiler = new MindARImage.Compiler();
        var buffer;
        if (mindFile) {
          // .mind file already compiled — use directly
          var resp = await fetch(mindFile);
          buffer = await resp.arrayBuffer();
        } else {
          // Compile image target on the fly (slower, less accurate)
          var imgBuffer = await fetch(targetImg).then(function(r) { return r.arrayBuffer(); });
          var img = await createImageBitmap(new Blob([imgBuffer]));
          buffer = await compiler.compileImageTarget(img);
        }

        var instance = new MindARImage.Instance({
          canvas: canvas,
          onTargetFound: function(targetIndex) {
            console.log('[ar-xr] Target found:', targetIndex);
            sendMessage('TARGET_FOUND', { targetIndex: targetIndex, qrId: qrId, word: word });
            showCardLabel(word);
            if (loadedModel) {
              loadedModel.visible = true;
            }
          },
          onTargetLost: function(targetIndex) {
            console.log('[ar-xr] Target lost:', targetIndex);
            sendMessage('TARGET_LOST', { targetIndex: targetIndex, qrId: qrId });
            if (loadedModel) {
              loadedModel.visible = false;
            }
          },
          onUpdate: function(targetIndex) {
            // Called every frame while target is tracked
          },
        });

        controller = instance;

        // Load model in parallel with AR engine
        var modelPromise = modelUrl ? loadModel(modelUrl) : Promise.resolve(null);

        await instance.start();
        hideOverlay();
        updateDebug('Tracking active');

        sendMessage('AR_READY', {
          engine: 'mindar-local',
          qrId: qrId,
          word: word,
          hasModel: !!modelUrl,
        });

        // Wait for model
        await modelPromise;

      } catch (err) {
        console.error('[ar-xr] MindAR init error:', err);
        showError(err.message || 'Failed to start AR');
        sendMessage('SYSTEM_ERROR', {
          code: 'XR_INIT_FAILED',
          message: err.message || 'AR initialization failed',
        });
      }
    }

    // ========== MESSAGE LISTENER (from parent) ==========
    window.addEventListener('message', function(event) {
      var data = event.data || {};
      if (!data.type) return;
      console.log('[ar-xr] RECV:', data.type, data.payload);

      switch (data.type) {
        case 'DEBUG_TOGGLE':
          debugPanel.style.display = data.payload && data.payload.enabled ? 'block' : 'none';
          break;
      }
    });

    // ========== MAIN ==========
    async function main() {
      console.log('[ar-xr] Initializing with params:', {
        qr_id: qrId, mind_file: mindFile, target_img: targetImg,
        model_url: modelUrl, word: word, isDebug: isDebug
      });

      initThree();
      updateDebug('Three.js ready');

      // GLTFLoader lives on THREE global
      THREE.GLTFLoader = THREE.GLTFLoader || GLTFLoader;

      await initMindAR();
      animate();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main);
    } else {
      main();
    }
  })();
  </script>
</body>
</html>
