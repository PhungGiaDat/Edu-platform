            idleRunning: idleAction ? idleAction.isRunning() : false,
            idleWeight: idleAction ? idleAction.getEffectiveWeight() : 0,
            idleTime: idleAction ? idleAction.time : null,
          });
        }
        sendARDebug('COMBO_ANIMATION_FINISHED', { targetName: activeRule.actorTarget, runId });
        if (catActor) {
          restoreCatIdleAfterOneShot(actorInst, action, activeRule.animation, clip.name);
          catAnimationState.action = null;
          catAnimationState.clipName = null;
          catAnimationState.source = null;
          catAnimationState.priority = 0;
          resetCatAmbientIdle('combo_complete');
        } else if (idleClip) {
          action.fadeOut(0.12);
          const idleAction = mixer.clipAction(idleClip);
          idleAction.reset();
          idleAction.fadeIn(0.12);
          idleAction.play();
          sendARDebug('INTERACTION_IDLE_RESTORED', {
            ruleId: activeRule.id,
            actorTarget: activeRule.actorTarget,
            idleClip: idleClip.name,
          });
        }
        interactionState.comboPlaying = false;
        interactionState.comboConsumed = true;
        setInteractionPhase(InteractionPhase.COMBO_CONSUMED);

        const root2 = getInteractionRoot(actorInst);
        const fromYaw = root2 ? root2.rotation.y : 0;
        const toYaw = interactionState.comboLatch?.actorOriginalYaw ?? 0;
        interactionState.actorReturn = {
          ruleId: activeRule.id,
          actorTarget: activeRule.actorTarget,
          runId,
          fromYaw,
          toYaw,
          startedAt: performance.now(),
          durationMs: COMBO_VISUAL_CONFIG.returnTurnMs,
        };
        if (catActor) sendARDebug('CAT_RETURN_START', { runId });
        sendARDebug('INTERACTION_ANIMATION_FINISHED', {
          ruleId: activeRule.id,
          actorTarget: activeRule.actorTarget,
          clip: clip.name,
          runId,
        });
      };
      mixer.addEventListener('finished', onFinish);
      return true;
    }

    function isTargetInActiveInteraction(targetName) {
      const latch = interactionState.comboLatch;
      const selectedParticipants = {
        actorTarget: interactionState.actorTarget,
        partnerTargets: interactionState.partnerTargets,
      };
      const participants = latch
        ? getInteractionParticipantTargets(latch)
        : getInteractionParticipantTargets(selectedParticipants);
      return participants.includes(targetName);
    }

    function hideConfirmedTargetLoss(targetName, lostForMs) {
      const instance = targetInstances.get(targetName);
      const wasTargetModelVisible = !!instance?.model?.visible;
      const wasPrimaryModelVisible = targetName === primaryModelTargetName && !!loadedModel?.visible;

      if (instance?.model) instance.model.visible = false;
      if (targetName === primaryModelTargetName) {
        if (loadedModel) loadedModel.visible = false;
        if (activeTargetName === targetName) activeTargetName = null;
        modelAttached = false;
      }

      sendARDebug('MODEL_HIDDEN_TARGET_LOST', {
        targetName,
        lostForMs: Math.round(lostForMs),
        wasVisible: wasTargetModelVisible || wasPrimaryModelVisible,
      });
    }

    function processPendingTargetLosses(now) {
      for (const [targetName, graceStart] of interactionState.pendingGraceHides) {
        const lossGrace = getTargetLossGraceState({
          lostAt: graceStart,
          now,
          lostGraceMs: INTERACTION_CONFIG.lostGraceMs,
        });
        if (!lossGrace.confirmed) continue;

        interactionState.pendingGraceHides.delete(targetName);
        const instance = targetInstances.get(targetName);
        if (instance) instance.lossConfirmedAt = now;
        sendARDebug('TARGET_LOST_CONFIRMED', {
          targetName,
          lostForMs: Math.round(lossGrace.lostForMs),
        });

        if (isTargetInActiveInteraction(targetName)) {
          resetInteractionSession('interaction_participant_lost');
        }
        hideConfirmedTargetLoss(targetName, lossGrace.lostForMs);
      }
    }

    function evaluateInteraction(now) {
      const activeRule = selectRuntimeInteractionRule(now);
      if (!activeRule) return;
      const actorInst = targetInstances.get(activeRule.actorTarget);
      const partnerTarget = activeRule.partnerTargets[0];
      const partnerInst = targetInstances.get(partnerTarget);
      const proximityConfig = resolveRuleProximityConfig(activeRule, null);
      if (!actorInst || !partnerInst || !proximityConfig) return;

      const effectiveTargets = new Set(getEffectivelyTrackedTargetNames(now));
      const actorEffectivelyTracked = effectiveTargets.has(activeRule.actorTarget);
      const partnerEffectivelyTracked = effectiveTargets.has(partnerTarget);

      // ---- Actor lock state ----
      // Only stamp foundAt on the first tracking contact of a fresh cycle.
      if (actorInst?.tracked && actorInst.foundAt == null) {
        actorInst.foundAt = now;
      }

      // Confirmed actor loss (grace expired) → full reset
      if (!actorEffectivelyTracked && interactionState.phase !== InteractionPhase.SEARCH_PRIMARY) {
        sendARDebug('PRIMARY_UNLOCKED', {
          reason: 'actor_lost_grace',
          lostForMs: actorInst ? now - actorInst.lostAt : null,
        });
        resetInteractionSession('actor_lost_grace');
        return;
      }

      // Lock the selected actor when continuously tracked for primaryLockMs
      if (actorInst?.tracked && interactionState.phase === InteractionPhase.SEARCH_PRIMARY) {
        if (actorInst.foundAt == null) actorInst.foundAt = now;
        const stableMs = now - actorInst.foundAt;
        if (stableMs >= INTERACTION_CONFIG.primaryLockMs) {
          if (stableMs > 3000) {
            sendARDebug('PRIMARY_STABLE_TIME_SUSPICIOUS', { stableMs, targetName: activeRule.actorTarget });
          }
          interactionState.primaryLockedAt = now;
          sendARDebug('PRIMARY_LOCKED', { targetName: activeRule.actorTarget, stableMs });
          sendARDebug('INTERACTION_ACTOR_LOCKED', {
            ruleId: activeRule.id,
            actorTarget: activeRule.actorTarget,
            stableMs,
          });
          setInteractionPhase(InteractionPhase.PRIMARY_LOCKED, { stableMs });
          setInteractionPhase(InteractionPhase.WAIT_SECONDARY);
        }
      }

      // Clear foundAt if the actor was lost before ever locking
      if (!actorInst?.tracked && actorInst?.foundAt != null && actorInst?.lostAt != null) {
        if ((now - actorInst.foundAt) < INTERACTION_CONFIG.primaryLockMs) {
          actorInst.foundAt = null;
        }
      }

      const activeReturn = interactionState.actorReturn;
      if (activeReturn) {
        if (activeReturn.runId !== interactionState.comboRunId) {
          interactionState.actorReturn = null;
          if (isCatMascotInstance(actorInst)) sendARDebug('CAT_RETURN_CANCELLED_STALE', {
            runId: activeReturn.runId,
            currentRunId: interactionState.comboRunId,
          });
        } else {
          const returnTick = advanceCatReturnTween(now, activeReturn);
          const returnActorInst = targetInstances.get(activeReturn.actorTarget);
          const root = returnActorInst ? getInteractionRoot(returnActorInst) : null;
          if (root) root.rotation.y = returnTick.yaw;

          if (returnTick.complete) {
            if (root) root.rotation.y = activeReturn.toYaw;
            interactionState.actorReturn = null;
            if (isCatMascotInstance(returnActorInst)) {
              sendARDebug('CAT_RETURN_COMPLETE', {
                runId: activeReturn.runId,
                finalYawDeg: (activeReturn.toYaw * 180 / Math.PI).toFixed(1),
              });
            }
            sendARDebug('INTERACTION_ACTOR_RETURN_COMPLETE', {
              ruleId: activeReturn.ruleId,
              actorTarget: activeReturn.actorTarget,
              runId: activeReturn.runId,
            });
          }
        }
      }

      const phase = interactionState.phase;

      // ---- COMBO_TURNING: tween actor body yaw, then start the rule animation ----
      if (phase === InteractionPhase.COMBO_TURNING) {
        updateActorTurn(now);
        const raw = computeTargetPairDistance(actorInst, partnerInst);
        updateFilteredDistance(raw, proximityConfig);
        return;
      }

      // ---- COMBO_PLAYING: selected rule animation running ----
      if (phase === InteractionPhase.COMBO_PLAYING) {
        const raw = computeTargetPairDistance(actorInst, partnerInst);
        updateFilteredDistance(raw, proximityConfig);
        return;
      }

      // ---- Proximity / combo phases ----
      if (
        phase === InteractionPhase.PRIMARY_LOCKED ||
        phase === InteractionPhase.WAIT_SECONDARY ||
        phase === InteractionPhase.WAIT_SECONDARY_MODEL ||
        phase === InteractionPhase.PROXIMITY_PENDING ||
        phase === InteractionPhase.COMBO_ARMED ||
        phase === InteractionPhase.COMBO_TURNING ||
        phase === InteractionPhase.COMBO_CONSUMED
      ) {
        // Secondary asset readiness: GLB loaded + model object exists.
        // NOT dependent on model.visible (output state).
        const secondaryAssetReady = !!(
          partnerInst?.modelState === 'loaded' &&
          partnerInst?.model
        );
        const secondaryTracked = partnerEffectivelyTracked;
        const secondaryInteractionReady = !!(
          secondaryAssetReady &&
          secondaryTracked &&
          !interactionState.comboConsumed
        );

        // Throttled diagnostic: only log when values actually change
        if (partnerInst) {
          const key = `${activeRule.id}|${partnerInst.modelState}|${!!partnerInst.model}|${!!partnerInst.tracked}|${!!partnerInst.visibleByInteraction}`;
          if (key !== interactionState.lastSecondaryReadiness) {
            interactionState.lastSecondaryReadiness = key;
            sendARDebug('SECONDARY_READINESS', {
              ruleId: activeRule.id,
              targetName: partnerTarget,
              modelState: partnerInst.modelState,
              hasModel: !!partnerInst.model,
              tracked: !!partnerInst.tracked,
              modelVisible: !!partnerInst.model?.visible,
              visibleByInteraction: partnerInst.visibleByInteraction,
              assetReady: secondaryAssetReady,
              interactionReady: secondaryInteractionReady,
            });
          }
        }

        // Partner found → decide if we can go straight to proximity
        if (partnerEffectivelyTracked && phase === InteractionPhase.WAIT_SECONDARY) {
          if (secondaryAssetReady) {
            setInteractionPhase(InteractionPhase.PROXIMITY_PENDING);
          } else {
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY_MODEL);
            sendARDebug('COMBO_WAITING_FOR_SECONDARY_MODEL', {
              ruleId: activeRule.id,
              targetName: partnerTarget,
              modelState: partnerInst?.modelState,
              hasModel: !!partnerInst?.model,
            });
          }
        }

        // Partner leaves → drop back to WAIT_SECONDARY
        if (!partnerEffectivelyTracked) {
          if (
            phase === InteractionPhase.PROXIMITY_PENDING ||
            phase === InteractionPhase.WAIT_SECONDARY_MODEL
          ) {
            interactionState.proximityEnteredAt = null;
            updateFilteredDistance(null, proximityConfig);
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY);
          }
        }

        // Partner asset became ready mid-session → reset proximity timer
        if (secondaryAssetReady && phase === InteractionPhase.WAIT_SECONDARY_MODEL) {
          interactionState.proximityEnteredAt = null;
          interactionState.filteredDistance = null;
          sendARDebug('SECONDARY_INTERACTION_READY', {
            ruleId: activeRule.id,
            targetName: partnerTarget,
            modelState: partnerInst.modelState,
          });
          setInteractionPhase(InteractionPhase.PROXIMITY_PENDING);
        }

        const raw = computeTargetPairDistance(actorInst, partnerInst);
        const filtered = updateFilteredDistance(raw, proximityConfig);

        // Throttled proximity log
        const sampleInterval = 1000 / INTERACTION_CONFIG.proximitySampleHz;
        if (raw != null && (now - interactionState.lastProximityLog) >= sampleInterval) {
          interactionState.lastProximityLog = now;
          sendARDebug('PROXIMITY_SAMPLE', {
            ruleId: activeRule.id,
            actorTarget: activeRule.actorTarget,
            partnerTarget,
            rawDistance: Number(raw.toFixed(4)),
            filteredDistance: filtered != null ? Number(filtered.toFixed(4)) : null,
            enterDistance: proximityConfig.enterDistance,
            exitDistance: proximityConfig.exitDistance,
            actorTracked: actorEffectivelyTracked,
            partnerTracked: partnerEffectivelyTracked,
            secondaryInteractionReady,
          });
        }

        // ---- Proximity enter / stable / combo arm ----
        if (filtered != null && actorEffectivelyTracked && partnerEffectivelyTracked && !interactionState.comboPlaying) {
          const gate = advanceComboProximityGate({
            now,
            distance: filtered,
            enteredAt: interactionState.proximityEnteredAt,
            comboConsumed: interactionState.comboConsumed,
            config: {
              enterDistance: proximityConfig.enterDistance,
              exitDistance: proximityConfig.exitDistance,
              proximityStableMs: proximityConfig.stableMs,
            },
          });
          if (!interactionState.comboConsumed) {
            if (gate.enteredAt != null && interactionState.proximityEnteredAt == null) {
              interactionState.proximityEnteredAt = now;
              sendARDebug('PROXIMITY_ENTER', {
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                partnerTarget,
                filteredDistance: Number(filtered.toFixed(4)),
              });
            }
            if (gate.enteredAt == null && interactionState.proximityEnteredAt != null) {
              sendARDebug('PROXIMITY_EXIT', { filteredDistance: Number(filtered.toFixed(4)) });
            }
            interactionState.proximityEnteredAt = gate.enteredAt;
            const stableFor = gate.enteredAt == null ? 0 : now - gate.enteredAt;
            if (
              phase === InteractionPhase.PROXIMITY_PENDING &&
              secondaryInteractionReady &&
              gate.stable &&
              !interactionState.comboConsumed
            ) {
              sendARDebug('PROXIMITY_STABLE', {
                ruleId: activeRule.id,
                stableMs: stableFor,
                distance: Number(filtered.toFixed(4)),
              });
              sendARDebug('COMBO_ARMED', {
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                partnerTargets: activeRule.partnerTargets,
              });

              // A CAT mascot one-shot must yield to a priority-100 interaction.
              if (isCatMascotInstance(actorInst)) cancelActiveCatOneShotForCombo();

              // Capture comboRunId
              interactionState.comboRunId++;
              const runId = interactionState.comboRunId;

              const actorPose = trackedTargets.get(activeRule.actorTarget);
              const partnerPose = trackedTargets.get(partnerTarget);
              const root = getInteractionRoot(actorInst);
              const actorOriginalYaw = root ? root.rotation.y : 0;

              interactionState.comboLatch = {
                runId,
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                partnerTargets: [...activeRule.partnerTargets],
                actorPose: actorPose ? { ...actorPose } : null,
                partnerPose: partnerPose ? { ...partnerPose } : null,
                actorOriginalYaw,
              };

              setInteractionPhase(InteractionPhase.COMBO_ARMED);
              sendARDebug('COMBO_TRACKING_LATCHED', {
                runId,
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                partnerTargets: activeRule.partnerTargets,
                actorPose: actorPose?.position,
                partnerPose: partnerPose?.position,
                actorOriginalYawDeg: (actorOriginalYaw * 180 / Math.PI).toFixed(1),
              });

              // ---- Begin turn: calculate direction from latched poses ----
              let targetYaw = actorOriginalYaw;
              const actorPoseForTurn = interactionState.comboLatch?.actorPose?.position;
              const partnerPoseForTurn = interactionState.comboLatch?.partnerPose?.position;
              if (activeRule.action.facePrimaryPartner && actorPoseForTurn && partnerPoseForTurn) {
                targetYaw = yawFromForward(actorPoseForTurn, partnerPoseForTurn)
                  + (COMBO_VISUAL_CONFIG.forwardYawOffsetDeg * Math.PI / 180);

                // Clamp to max body yaw
                const maxRad = COMBO_VISUAL_CONFIG.maxBodyYawDeg * Math.PI / 180;
                if (targetYaw > maxRad) targetYaw = maxRad;
                if (targetYaw < -maxRad) targetYaw = -maxRad;
              }

              setInteractionPhase(InteractionPhase.COMBO_TURNING);
              sendARDebug('INTERACTION_ACTOR_TURN_START', {
                runId,
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                partnerTarget,
                requestedYawDeg: ((targetYaw - actorOriginalYaw) * 180 / Math.PI).toFixed(1),
                clampedYawDeg: ((targetYaw) * 180 / Math.PI).toFixed(1),
              });
              if (isCatMascotInstance(actorInst)) {
                sendARDebug('CAT_TURN_START', {
                  runId,
                  secondaryTargetName: partnerTarget,
                  requestedYawDeg: ((targetYaw - actorOriginalYaw) * 180 / Math.PI).toFixed(1),
                  clampedYawDeg: ((targetYaw) * 180 / Math.PI).toFixed(1),
                });
              }
              interactionState.actorTurn = {
                runId,
                ruleId: activeRule.id,
                actorTarget: activeRule.actorTarget,
                fromYaw: actorOriginalYaw,
                toYaw: targetYaw,
                startedAt: now,
                durationMs: COMBO_VISUAL_CONFIG.bodyTurnMs,
              };
              interactionState.comboPlaying = true;
            }
          }

          // Rearm when cards separate beyond EXIT
          if (
            gate.rearmEligible &&
            phase === InteractionPhase.COMBO_CONSUMED
          ) {
            sendARDebug('COMBO_REARMED', { ruleId: activeRule.id, distance: Number(filtered.toFixed(4)) });
            interactionState.comboConsumed = false;
            interactionState.proximityEnteredAt = null;
            setInteractionPartnerVisibility({ rule: activeRule, targetInstances, visible: true });
            setInteractionPhase(InteractionPhase.WAIT_SECONDARY);
          }
        }
      }
    }

    // ========== TARGET FOUND / LOST ==========
    function onTargetFound(detail) {
      saveTargetPose(detail);
      const now = performance.now();
      const instance = targetInstances.get(detail.name);
      const graceStart = interactionState.pendingGraceHides.get(detail.name);
      const lossGrace = graceStart == null
        ? null
        : getTargetLossGraceState({
          lostAt: graceStart,
          now,
          lostGraceMs: INTERACTION_CONFIG.lostGraceMs,
        });

      if (lossGrace?.confirmed) processPendingTargetLosses(now);

      if (instance) {
        instance.tracked = true;
        instance.lostAt = null;
        instance.lossConfirmedAt = null;
        if (instance.foundAt == null) instance.foundAt = now;
        // If model was already loaded before this FOUND event, mark ready immediately.
        if (detail.name !== primaryModelTargetName && instance.modelState === 'loaded' && instance.model) {
          instance.interactionReady = true;
        }
      }

      // Cancel only a brief loss. A late callback was confirmed above.
      if (lossGrace?.withinGrace) {
        interactionState.pendingGraceHides.delete(detail.name);
        sendARDebug('TARGET_REACQUIRED_WITHIN_GRACE', {
          targetName: detail.name,
          lostForMs: Math.round(lossGrace.lostForMs),
        });
      }

      const config = targetConfigByName.get(detail.name);
      const targetWord = config?.word || detail.name;

      sendARDebug('TARGET_FOUND', {
        qrId: detail.name,
        word: targetWord,
        trackedCount: trackedTargets.size,
        trackedTargets: Array.from(trackedTargets.keys()),
      });
      sendMessage('TARGET_FOUND', { qrId: detail.name, word: targetWord, trackedCount: trackedTargets.size });
      showCardLabel(targetWord);

      // Primary target: legacy singleton attach path (preserves CAT_IDLE mixer, etc.)
      if (detail.name === primaryModelTargetName) {
        resetCatAmbientIdle('target_acquired');
        attemptModelAttach(detail.name);
      } else {
        // Non-primary: reuse the already-preloaded promise (concurrent preload started in main()).
        // Never call GLTFLoader.load again — ensureTargetModelLoaded is a no-op if a promise exists.
        ensureTargetModelLoaded(detail.name).then(model => {
          if (!model) return;
          const inst = targetInstances.get(detail.name);
          if (!inst) return;
          if (scene && inst.anchor && inst.offsetGroup) {
            reparentModelToAnchor(inst);
          }
          // Only show if target is still tracked AND interaction allows visibility.
          // Guard against lost-during-preload AND combo-consume state.
          if (inst.tracked && trackedTargets.has(detail.name) && inst.visibleByInteraction) {
            const pose = trackedTargets.get(detail.name);
            if (pose) applyTargetPose(inst, pose);
            inst.model.visible = true;
            // Mark interaction-ready so combo can fire only after model is visible.
            inst.interactionReady = true;
            sendARDebug('TARGET_MODEL_ATTACH', {
              targetName: detail.name,
              source: inst.modelState === 'loaded' ? 'preloaded' : 'pending-preload',
              interactionReady: true,
            });
          }
        });
      }

      sendARDebug('MULTI_TARGET_STATE', { count: trackedTargets.size, targets: Array.from(trackedTargets.keys()) });
    }

    function onTargetLost(name) {
      const instance = targetInstances.get(name);
      const now = performance.now();

      // Track loss immediately
      trackedTargets.delete(name);
      if (instance) {
        instance.tracked = false;
        instance.pose = null;
        instance.lostAt = now;
        instance.lossConfirmedAt = null;
        // DO NOT hide model immediately — visual grace is handled independently.
        // after lostGraceMs expires.  This preserves cat visibility during
        // brief occlusion and during COMBO_PLAYING.
      }

      // Register pending grace hide
      if (!interactionState.pendingGraceHides.has(name)) {
        interactionState.pendingGraceHides.set(name, now);
        sendARDebug('TARGET_LOST_PENDING', {
          qrId: name,
          graceMs: INTERACTION_CONFIG.lostGraceMs,
          isPrimary: name === primaryModelTargetName,
        });
      }
      sendMessage('TARGET_LOST', { qrId: name });

      // Preserve primary attachment through grace; confirmed loss clears it.
      // Keep the existing model attached and visible during grace. Confirmed loss
      // clears activeTargetName/modelAttached in processPendingTargetLosses().

      sendARDebug('MULTI_TARGET_STATE', { count: trackedTargets.size, targets: Array.from(trackedTargets.keys()), lost: name });
    }

    // ========== COMBO DETECTION (background) ==========
    async function loadComboRules() {
      const deck = params.get('deck_id') || 'claymorphic-animals-001';
      let rawRules = [];
      try {
        const url = `${apiBase}/api/v1/combos/rules?flashcard_set=${encodeURIComponent(deck)}`;
        const res = await fetch(url);
        if (res.ok) {
          rawRules = (await res.json()).rules || [];
          sendARDebug('COMBO_RULE_LOAD_COMPLETE', { count: rawRules.length, url });
        }
        else sendARDebug('COMBO_RULE_LOAD_ERROR', { status: res.status });
      } catch (e) {
        sendARDebug('COMBO_RULE_LOAD_ERROR', { error: String(e) });
      } finally {
        installInteractionRules(rawRules);
      }
    }

    // ========== MESSAGE LISTENER ==========
    window.addEventListener('message', (event) => {
      const { type, payload } = event.data || {};
      if (!type) return;

      if (type === 'REQUEST_IFRAME_LOGS') {
        window.parent.postMessage({ type: 'IFRAME_LOGS', payload: { requestId: payload?.requestId || 'unknown', logs: window.XRDebug?.getLogs() || '', engine: '8th-wall', qrId, word }, timestamp: Date.now() }, '*');
        return;
      }
      if (type === 'DEBUG_TOGGLE') { debugPanel.style.display = payload?.enabled ? 'block' : 'none'; return; }
      if (type === 'TRIGGER_TELEGRAM_SYNC') {
        const fullLogs = `=== STATE ===\nqrId: ${qrId}\nword: ${word}\nprimaryModelLoaded: ${!!loadedModel}\nprimaryModelVisible: ${loadedModel?.visible || false}\ntrackedTargets: ${Array.from(trackedTargets.keys()).join(', ') || 'none'}\nmodelLoadState: ${modelLoadState}\ncurrentPhase: ${currentPhase}`;
        window.parent.postMessage({ type: 'TELEGRAM_SYNC_READY', payload: { logs: fullLogs, manualOffset: payload?.manualOffset, engine: '8th-wall', flashcardCount: trackedTargets.size || 1 }, timestamp: Date.now() }, '*');
        return;
      }
      logToBuffer('debug', 'Message received', { type });
    });

    // ========== STAGED MODEL PRELOAD ==========
    // Phase 1: load primary model immediately (cat — user expects this first).
    // Phase 2: after primary completes, begin secondary preloads (fish) in background.
    // Never initiate new downloads from IMAGE_FOUND — reuse existing promises.

    function preloadSecondaryTargets() {
      const secondary = xrTargetConfigs.filter(
        cfg => cfg.qr_id !== primaryModelTargetName && cfg.model_3d_url
      );
      if (secondary.length === 0) return;
      sendARDebug('SECONDARY_PRELOAD_BATCH_START', {
        targets: secondary.map(c => c.qr_id),
      });
      secondary.forEach(cfg => ensureTargetModelLoaded(cfg.qr_id));
    }

    // ========== MAIN ==========
    async function main() {
      sendARDebug('PAGE_LOAD');
      try {
        initThree();
        updateDebug('Three.js ready');
        loadComboRules();

        const targetsPromise = Promise.all(xrTargetConfigs.map(cfg => loadTargetData(cfg)));

        // Phase 1: preload primary model immediately — no await.
        sendARDebug('MODEL_PRIMARY_PRELOAD_START', { targetName: primaryModelTargetName });
        const primaryModelPromise = ensureTargetModelLoaded(primaryModelTargetName);
        primaryModelPromise.then(() => {
          sendARDebug('PRIMARY_MODEL_READY', { targetName: primaryModelTargetName });
          // Phase 2: kick off secondary preloads after primary is ready.
          preloadSecondaryTargets();
        });

        const targetDataList = await targetsPromise;
        sendARDebug('MULTI_TARGET_DATA_READY', { count: targetDataList.length, targets: targetDataList.map(t => t.name) });

        setPhase('loading');
        sendARDebug('LOADING_ASSETS', { hasModel: !!modelUrl, targetCount: targetDataList.length });

        // XR init must NOT wait for model downloads.
        await initXR(targetDataList);

        setPhase('viewing');
        sendARDebug('INIT_COMPLETE', { modelLoaded: !!loadedModel, targetCount: targetDataList.length });

        // Attach CAT gesture handlers — pointer events work for touch and mouse.
        window.addEventListener('pointerdown', onPointerDown, { passive: true });
        window.addEventListener('pointerup', onPointerUp, { passive: true });
        window.addEventListener('pointercancel', onPointerCancel, { passive: true });
        sendARDebug('CAT_GESTURE_HANDLERS_REGISTERED', {});
        logToBuffer('info', 'Initialization complete');
      } catch (error) {
        setPhase('error');
        sendARDebug('INIT_ERROR', { error: String(error), stack: error?.stack });
        logToBuffer('error', 'Initialization failed', { error: String(error) });
        showError(String(error));
      }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
    else main();
  </script>
</body>
</html>
