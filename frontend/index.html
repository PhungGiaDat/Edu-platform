<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- 
    IMPORTANT: A-Frame/AR.js removed from parent app!
    Using IFRAME ISOLATION pattern - AR runs inside ar-nft.html iframe only.
    This prevents version conflicts and React lifecycle interference.
    See: frontend-web/public/ar-nft.html for AR runtime.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Platform</title>

  <!-- Performance: preconnect to Google Fonts CDN before CSS @import fires -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Performance: early DNS resolution + TCP connection to Render API backend.
       Reduces cold-connection latency on first API call (quiz, AR data, pets). -->
  <link rel="preconnect" href="https://edu-platform-api-do20.onrender.com" />
  <link rel="dns-prefetch" href="https://edu-platform-api-do20.onrender.com" />
</head>

<body>
  <div id="root"></div>
  <!-- Install the debug buffer before React and either AR engine can start. -->
  <script src="/static/ar-assets/js/mobile-debug.js"></script>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Eruda mobile console - Activate with ?debug=true or ?eruda=true -->
  <script>
    (function() {
      var erudaRoot = null;

      function initEruda() {
        if (typeof eruda === 'undefined') return false;

        // Never mount Eruda on document.body. Eruda assigns its container the
        // #eruda id, so styling that id would otherwise resize the whole page
        // and collapse the React/AR iframe to 0x0.
        if (!erudaRoot) {
          erudaRoot = document.createElement('div');
          erudaRoot.setAttribute('data-eruda-root', 'true');
          document.body.appendChild(erudaRoot);
        }

        eruda.init({
          container: erudaRoot,
          tool: ['console', 'elements', 'network', 'sources', 'storage'],
          useSnapshots: false,
          overrideConsole: true,
          theme: 'dark',
        });

        // Copy from MobileDebug's unified parent + iframe buffer instead of
        // scraping Eruda DOM (which is inaccessible when useShadowDom=true).
        var copyButton = document.createElement('button');
        copyButton.type = 'button';
        copyButton.setAttribute('data-eruda-copy-all', 'true');
        copyButton.textContent = '📋 Copy logs';
        copyButton.style.cssText = 'position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:2147483647;padding:8px 12px;border:0;border-radius:999px;background:#14b8a6;color:#fff;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.35);';
        copyButton.onclick = async function() {
          var copied = Boolean(window.MobileDebug && await window.MobileDebug.copy());
          copyButton.textContent = copied ? '✅ Copied' : '❌ Copy failed';
          setTimeout(function() { copyButton.textContent = '📋 Copy logs'; }, 1600);
        };
        erudaRoot.appendChild(copyButton);

        // mobile-debug.js starts before React/camera and buffers the early
        // lifecycle. Replay that snapshot only after Eruda owns console.*.
        if (window.MobileDebug && typeof window.MobileDebug.attachEruda === 'function') {
          window.MobileDebug.attachEruda();
        }

        // Auto-hide after 60s to not annoy user
        setTimeout(function() {
          if (typeof eruda.hide === 'function') eruda.hide();
        }, 60000);
        console.log('[eruda] Mobile console enabled');
        return true;
      }
      function waitForEruda() {
        if (initEruda()) return;
        // Try once more via CDN — handles CSP errors gracefully
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.crossOrigin = 'anonymous';
        s.onload = function() {
          if (!initEruda()) {
            console.warn('[eruda] init failed even after retry');
          }
        };
        s.onerror = function() {
          console.warn('[eruda] failed to load from CDN — possibly blocked by CSP');
        };
        document.head.appendChild(s);
      }
      var params = new URLSearchParams(window.location.search);
      if (params.get('debug') === 'true' || params.get('eruda') === 'true') {
        // The isolated root prevents Eruda from resizing document.body and
        // collapsing the React/AR iframe while the camera is active.
        waitForEruda();
      }
    })();
  </script>
</body>

</html>
