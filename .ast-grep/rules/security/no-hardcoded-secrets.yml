id: no-hardcoded-secrets
language: TypeScript
severity: error
message: "Possible hardcoded secret detected — move to environment variables"
note: "Use process.env.X, .env files, or a secrets manager (Vault, AWS SM)"
rule:
  any:
    - pattern: |
        $KEY = "$VALUE"
    - patterns:
        - pattern: $KEY = "$VALUE"
        - regex: "(api[_-]?key|secret|token|password|passwd|pwd)"
        - kind: string_fragment
fix: "process.env.<KEY_NAME>"