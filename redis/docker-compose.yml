# ========================================
# Eduplatform - Redis Docker Compose
# Local Development Environment
# ========================================
# Usage:
#   docker-compose -f redis/docker-compose.yml up -d
# ========================================

services:
  # ========================================
  # Redis Cache & Session Store
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: eduplatform-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly no
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eduplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - redis  # Only start with: docker-compose --profile redis up -d

# ========================================
# Volumes
# ========================================
volumes:
  redis_data:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  eduplatform-network:
    external: true
    # Uncomment below to create a new network
    # driver: bridge
