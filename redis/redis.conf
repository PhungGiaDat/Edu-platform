# ========================================
# Redis Configuration
# Eduplatform - Session & Cache Store
# ========================================
# For local development without persistence:
#   redis-server redis.conf
#
# For Docker, mount this file:
#   docker run -v $(pwd)/redis.conf:/usr/local/etc/redis/redis.conf redis redis-server /usr/local/etc/redis/redis.conf

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (disabled for sessions - they have their own TTL)
save ""
appendonly no
appendfsync everysec

# Clients
timeout 300
tcp-keepalive 60

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Database
databases 16
